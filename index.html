<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D6001C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ร้านเมย์">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>May MiniMart — ระบบจัดการร้านเมย์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,500;0,600;0,700;0,800;1,600;1,800&family=Roboto:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Thai+Looped:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700;800&family=Kanit:wght@400;500;600&family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>/* ฟอนต์ที่เจ้าของร้านเลือก (ใช้ก่อนวาดหน้า กันกระพริบ) · ค่าเริ่มต้น = สารบรรณ (Sarabun) */try{var f=JSON.parse(localStorage.getItem("mm_uiFont")||"null")||{};var fam=function(k){return(!k||k==="Loyverse"||k==="Noto Sans Thai Looped")?"'Sarabun'":"'"+k+"'";};var r=document.documentElement.style;r.setProperty("--fb",fam(f.body)+",'Noto Sans Thai',system-ui,sans-serif");r.setProperty("--fh",fam(f.head||f.body)+",'Noto Sans Thai',system-ui,sans-serif");r.setProperty("--fs",(15*(f.scale||1))+"px");}catch(e){}</script>
<style>
:root{
  --fb:"Sarabun","Noto Sans Thai",system-ui,sans-serif; --fh:"Sarabun","Noto Sans Thai",system-ui,sans-serif; --flogo:"Prompt","Noto Sans Thai",sans-serif; --fs:15px;
  --red:#D6001C; --red-d:#A80016; --red-l:#FFE9EC; --green:#0B8A3E; --green-l:#E5F5EC;
  --ink:#1D1B1C; --ink2:#5E5759; --ink3:#9A9294; --line:#ECE6E7; --bg:#F7F4F2; --card:#fff;
  --amber:#B86E00; --amber-l:#FFF3DC; --blue:#1F5FBF; --blue-l:#E8F0FC;
  --r:16px; --sh:0 1px 2px rgba(60,20,25,.06),0 4px 16px rgba(60,20,25,.06);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.5 var(--fb)}
h1,h2,h3,.disp{font-family:var(--fh);margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hidden{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;padding:calc(10px + var(--safe-t)) 16px 12px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:baseline;gap:4px;font-family:var(--flogo);font-weight:800;letter-spacing:-.5px}
.logo small{font-size:12px;font-weight:600;opacity:.9}
.logo b{font-size:24px;font-style:italic}
.logo i{font-size:11px;font-style:italic;font-weight:600;opacity:.85;margin-left:2px}
.top .sp{flex:1}
.top .who{font-size:12px;text-align:right;line-height:1.2;opacity:.95}
.chip-role{display:inline-block;background:rgba(255,255,255,.2);border-radius:99px;padding:1px 8px;font-size:11px;margin-top:2px}
.net{width:8px;height:8px;border-radius:50%;background:#7CF0A6;display:inline-block;margin-right:4px}
.net.off{background:#FFC24B}
/* layout */
main{max-width:860px;margin:0 auto;padding:14px 14px calc(96px + var(--safe-b))}
.vhead{display:flex;align-items:center;gap:10px;margin:4px 2px 12px}
.vhead h2{font-size:21px;flex:1}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:8px}
.muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:8px;align-items:center} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:420px){.grid4{grid-template-columns:repeat(2,1fr)}}
.right{text-align:right} .center{text-align:center}
.num{font-variant-numeric:tabular-nums}
/* buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--red);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)} .btn:disabled{opacity:.5}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.green{background:var(--green)} .btn.soft{background:var(--red-l);color:var(--red-d)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.iconbtn{border:0;background:transparent;padding:8px;border-radius:10px;cursor:pointer;display:inline-flex}
.iconbtn:active{background:rgba(0,0,0,.06)}
.top .iconbtn{color:#fff}
.iconbtn.tb{opacity:.9;padding:7px}
.top .iconbtn.tb{margin-left:-2px}
@media (max-width:480px){.logo i,.top .chip-role{display:none}.top{gap:4px}}
@media (max-width:340px){.top .who{display:none}}
/* inputs */
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:44px;outline:none}
.in:focus{border-color:var(--red)}
textarea.in{min-height:80px}
.search{position:relative}
.search .in{padding-left:40px;padding-right:48px;border-radius:14px;min-height:48px}
.search svg.s{position:absolute;left:12px;top:13px;color:var(--ink3)}
.search .scanbtn{position:absolute;right:4px;top:4px;height:40px;width:40px;border-radius:10px;border:0;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.tag.red{background:var(--red-l);color:var(--red-d)} .tag.green{background:var(--green-l);color:var(--green)}
.tag.amber{background:var(--amber-l);color:var(--amber)} .tag.blue{background:var(--blue-l);color:var(--blue)} .tag.gray{background:#F0ECEC;color:var(--ink2)}
/* list */
.list{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:active{background:#FBF8F7}
.item .t{font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .m{font-size:12px;color:var(--ink3);margin-top:2px}
.price{font-family:var(--fh);font-weight:700;font-size:18px;color:var(--red);white-space:nowrap}
.av{width:42px;height:42px;border-radius:12px;background:var(--red-l);color:var(--red-d);display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:700;flex:none;font-size:15px}
.empty{padding:30px 16px;text-align:center;color:var(--ink3)}
/* stats */
.stat{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--sh)}
.stat .k{font-size:12px;color:var(--ink2)} .stat .v{font-family:var(--fh);font-weight:700;font-size:20px;margin-top:2px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa button{border:0;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer}
.qa .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:14px}
.alert.red{background:var(--red-l);color:#7A0010} .alert.amber{background:var(--amber-l);color:#6B4000} .alert.green{background:var(--green-l);color:#05502A} .alert.blue{background:var(--blue-l);color:#123B78}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--safe-b))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink3);padding:4px 6px;min-width:58px;cursor:pointer}
.nav button.on{color:var(--red);font-weight:600}
.nav .fab{margin-top:-26px;color:var(--red);font-weight:600}
body.full .top,body.full .nav{display:none}
body.full main{max-width:none;padding:0}
body.kiosk .nav{display:none}
body.kiosk main{padding-bottom:calc(24px + var(--safe-b))}
.outbox{position:fixed;right:10px;top:calc(64px + var(--safe-t));z-index:40;background:var(--amber);color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;box-shadow:var(--sh)}
.nav .fab .c{width:58px;height:58px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(214,0,28,.4);border:4px solid var(--bg)}
/* sheet / modal */
.ov{position:fixed;inset:0;background:rgba(20,10,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
@keyframes fi{from{opacity:0}}
@keyframes su{from{transform:translateY(30px);opacity:.4}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:su .2s}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.sheet .sh h3{flex:1;font-size:18px}
.sheet .sb{overflow:auto;padding:4px 16px 16px}
.sheet .sf{padding:10px 16px calc(12px + var(--safe-b));display:flex;gap:8px;border-top:1px solid var(--line);background:#fff;border-radius:0 0 22px 22px}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:su .2s}
.toast.err{background:var(--red-d)}
/* scanner */
.scan{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
.scan video{flex:1;width:100%;object-fit:cover;min-height:0}
.scan .frame{position:absolute;left:10%;right:10%;top:30%;height:22%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.scan .frame:after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#ff3049;box-shadow:0 0 8px #ff3049;animation:ln 1.6s ease-in-out infinite}
@keyframes ln{0%,100%{transform:translateY(-34px)}50%{transform:translateY(34px)}}
.scan .bar{position:absolute;left:0;right:0;top:0;padding:calc(12px + var(--safe-t)) 14px 12px;display:flex;gap:8px;align-items:center;color:#fff;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.scan .bot{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(16px + var(--safe-b));background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff}
.scan .last{background:rgba(255,255,255,.95);color:var(--ink);border-radius:14px;padding:10px 12px;margin-bottom:10px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 60% at 50% 0%,#FFE1E5 0%,var(--bg) 60%)}
.login .brand{text-align:center;margin-bottom:18px}
.login .brand .mk{font-family:var(--flogo);font-weight:800;font-style:italic;font-size:56px;color:var(--red);line-height:1;letter-spacing:-2px}
.login .brand .mk small{font-size:18px;font-style:normal;vertical-align:top;margin-right:2px}
.login .brand .mm{font-family:var(--flogo);font-style:italic;color:var(--red);font-weight:600}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center;margin-top:14px}
.pinpad button{height:60px;border-radius:18px;border:0;background:#fff;box-shadow:var(--sh);font-family:var(--fh);font-size:22px;font-weight:600;cursor:pointer}
.pinpad button:active{background:var(--red-l)}
.dots{display:flex;gap:12px;justify-content:center;margin:12px 0 4px}
.dots i{width:14px;height:14px;border-radius:50%;background:#E3DADB}
.dots i.on{background:var(--red)}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:6px 6px;border-bottom:1.5px solid var(--line)}
table.t td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t input.in{min-height:36px;padding:6px 8px;border-radius:9px}
.scroll-x{overflow-x:auto}
canvas.lbl{background:#fff;border-radius:6px;box-shadow:0 0 0 1px var(--line),0 4px 14px rgba(0,0,0,.08);max-width:100%;image-rendering:pixelated}
.seg{display:flex;background:#EFE9E8;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 6px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.menu .item .av{background:#F2EDEC;color:var(--ink)}
.prog{height:8px;background:#EFE9E8;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--red)}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.big-price{font-family:var(--fh);font-weight:800;font-size:44px;color:var(--red);line-height:1}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
.spin.dark{border-color:#eee;border-top-color:var(--red)}
@keyframes sp{to{transform:rotate(360deg)}}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:95;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-weight:600}
/* print */
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;font-size:12px;color:#000}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #999;padding:3px 5px}
  #printArea h2{font-size:16px;margin:8px 0}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>

<script>
/* =========================================================
   May MiniMart — แอปจัดการร้าน (ไฟล์เดียว)
   ========================================================= */
'use strict';
const APP_VER = '2.6.10';
const LS = {
  get(k, d) { try { const v = localStorage.getItem('mm_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mm_' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem('mm_' + k); } catch (e) { } }
};
const S = {
  apiUrl: LS.get('apiUrl', ''), token: LS.get('token', ''), user: LS.get('user', null),
  products: LS.get('products', []), settings: LS.get('settings', {}), receipts: [], licenses: [], sales: [],
  view: 'home', online: navigator.onLine,
  device: LS.get('device', null), perms: LS.get('perms', {}), defs: {}, categories: LS.get('categories', []), shift: null
};
if (!S.device || !S.device.id) { S.device = { id: 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) }; LS.set('device', S.device); }
const devType = () => { const u = navigator.userAgent; if (/iPad|Macintosh/.test(u) && 'ontouchend' in document) return 'iPad'; if (/iPhone/.test(u)) return 'iPhone'; if (/Android/.test(u)) return /Mobile/.test(u) ? 'มือถือ Android' : 'แท็บเล็ต Android'; return 'คอมพิวเตอร์'; };
const can = p => !!S.user && (S.user.role === 'owner' || !!S.perms[p]);          // อนุญาต หรือ อนุญาตเมื่อใส่รหัสเจ้าของ
const canStrict = p => !!S.user && (S.user.role === 'owner' || S.perms[p] === true); // อนุญาตโดยไม่ต้องใส่รหัส
const isKiosk = () => !!S.user && S.user.role !== 'owner' && S.perms.posOnly === true;
const KIOSK_OK = ['pos', 'scannerset', 'salesreceipts', 'printer', 'displayset', 'scan', 'labels', 'stockcount', 'products', 'staff', 'customers'];
const seesSales = () => canStrict('reports') || canStrict('ownSales');
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; };
const money = (v, d = 2) => num(v).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
const baht = v => '฿' + money(v, num(v) % 1 ? 2 : 0);
const isOwner = () => S.user && S.user.role === 'owner';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const todayISO = () => { const d = new Date(Date.now() + 7 * 3600e3); return d.toISOString().slice(0, 10); };
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_MF = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const thDate = iso => { if (!iso) return '-'; const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number); if (!y) return iso; return d + ' ' + TH_M[m - 1] + ' ' + String(y + 543).slice(-2); };
const daysTo = iso => Math.round((new Date(iso + 'T00:00:00+07:00') - new Date(todayISO() + 'T00:00:00+07:00')) / 864e5);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- icons ---------- */
const I = (d, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  box: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8"/>',
  receipt: '<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',

/* รหัสเจ้าของร้าน: ถ้าเซิร์ฟเวอร์ตอบ PIN_REQUIRED จะเปิดแป้นให้เจ้าของกดรหัส แล้วส่งคำสั่งเดิมซ้ำ
   รหัสที่ถูกต้องใช้ต่อได้ 3 นาที (หรือจนกดล็อก) */
const Elev = {
  pin: null, until: 0,
  get ok() { return this.pin && Date.now() < this.until; },
  clear() { this.pin = null; this.until = 0; const b = $('#elev'); b && b.remove(); },
  set(pin) {
    this.pin = pin; this.until = Date.now() + 180e3;
    let b = $('#elev'); if (!b) { b = document.createElement('div'); b.id = 'elev'; b.className = 'outbox'; b.style.cssText = 'background:#7B3FB8;top:calc(92px + var(--safe-t));cursor:pointer'; b.onclick = () => { this.clear(); toast('ล็อกสิทธิ์เจ้าของแล้ว'); }; document.body.appendChild(b); }
    clearInterval(this.t); this.t = setInterval(() => { if (!this.ok) { this.clear(); clearInterval(this.t); } else b.textContent = '🔓 สิทธิ์เจ้าของ ' + Math.ceil((this.until - Date.now()) / 1000) + ' วิ · แตะเพื่อล็อก'; }, 1000);
  }
};
function ownerPinDlg(reason) {
  return new Promise(res => {
    let pin = '';
    const ov = sheet('ต้องใช้รหัสเจ้าของร้าน', `<div class="center small muted" style="margin-bottom:4px">${esc(reason || '')}</div><div class="dots">${'<i></i>'.repeat(6)}</div><div class="pinpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button data-c style="font-size:14px">ล้าง</button><button data-n="0">0</button><button data-ok style="background:#7B3FB8;color:#fff;font-size:15px">ยืนยัน</button></div>`, '', { onClose: () => res(null) });
    const dots = () => $$('.dots i', ov).forEach((d, i) => d.classList.toggle('on', i < pin.length));
    const ok = () => { if (pin.length < 4) return; ov.remove(); res(pin); };
    $$('[data-n]', ov).forEach(b => b.onclick = () => { if (pin.length < 8) pin += b.dataset.n; dots(); });
    $('[data-c]', ov).onclick = () => { pin = ''; dots(); }; $('[data-ok]', ov).onclick = ok;
    ov.tabIndex = 0; ov.focus(); ov.addEventListener('keydown', e => { if (/^\d$/.test(e.key) && pin.length < 8) { pin += e.key; dots(); } else if (e.key === 'Backspace') { pin = pin.slice(0, -1); dots(); } else if (e.key === 'Enter') ok(); });
  });
}
async function api(action, payload = {}, _retry) {
  if (Elev.ok && !payload.ownerPin) payload = { ...payload, ownerPin: Elev.pin };
  try { const r = await apiRaw(action, payload); window.cacheAfterWrite && cacheAfterWrite(action, payload); return r; }
  catch (e) {
    if (/^PIN_(REQUIRED|BAD)/.test(e.message) && !_retry && S.user && S.user.role !== 'owner') {
      if (/^PIN_BAD/.test(e.message)) { Elev.clear(); toast(e.message.replace(/^PIN_BAD:\s*/, ''), 1); }
      const was = busyEl ? $('div', busyEl) && $('div', busyEl).textContent : null; busy(0);
      const pin = await ownerPinDlg(e.message.replace(/^PIN_\w+:\s*/, ''));
      if (!pin) throw new Error('ยกเลิก — ต้องใช้รหัสเจ้าของร้าน');
      if (was) busy(1, was);
      const r = await api(action, { ...payload, ownerPin: pin }, true);

}
async function apiRaw(action, payload, tokenOverride) {
  if (!S.apiUrl) return Local.handle(action, payload);
  let res;
  // ตัดเวลารอ: Wi-Fi ต่ออยู่แต่ไม่มีเน็ต จะไม่ค้าง (งานหนักให้เวลานานกว่า)

  const ac = window.AbortController ? new AbortController() : null, tm = ac && setTimeout(() => ac.abort(), slow ? 90000 : 15000);

  } catch (e) { const er = new Error(e.name === 'AbortError' ? 'อินเทอร์เน็ตช้า/ไม่ตอบสนอง — ลองใหม่อีกครั้ง' : 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ต'); er.offline = true; Net.set(false); throw er; }
  finally { tm && clearTimeout(tm); }

  let j; try { j = await res.json(); } catch (e) { const er = new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (ตรวจ URL / การ Deploy)'); er.offline = true; throw er; }
  if (!j.ok) {
    if (/^AUTH:/.test(j.error)) { logout(true); throw new Error(j.error.replace('AUTH: ', '')); }
    throw new Error(j.error || 'เกิดข้อผิดพลาด');
  }
  return j;
}

/* ---------- product search index ---------- */
let IDX = { byBarcode: {}, bySku: {} };
const norm = s => String(s || '').toLowerCase().replace(/[\s\-_.,/()]+/g, '');
function buildIndex() {
  IDX = { byBarcode: {}, bySku: {} };
  S.products.forEach(p => { p._n = norm(p.name + ' ' + p.sku + ' ' + p.barcode + ' ' + p.category); if (p.barcode) String(p.barcode).split(/[,; ]+/).forEach(b => b && (IDX.byBarcode[b] = p)); IDX.bySku[p.sku] = p; });
}
function findByCode(code) {
  code = String(code).trim();
  if (IDX.byBarcode[code]) return { p: IDX.byBarcode[code] };
  if (/^\d{12}$/.test(code) && IDX.byBarcode['0' + code]) return { p: IDX.byBarcode['0' + code] };
  if (/^0\d{12}$/.test(code) && IDX.byBarcode[code.slice(1)]) return { p: IDX.byBarcode[code.slice(1)] };
  // บาร์โค้ดฝังราคา 20IIIIIPPPPPC
  if (/^20\d{11}$/.test(code)) { const item = code.slice(2, 7), price = Number(code.slice(7, 12)) / 100; const p = S.products.find(x => String(x.sku).padStart(5, '0').slice(-5) === item); if (p) return { p, price }; }
  if (IDX.bySku[code]) return { p: IDX.bySku[code] };
  return null;
}
function searchProducts(q, f = {}) {
  const toks = String(q || '').toLowerCase().split(/\s+/).map(norm).filter(Boolean);
  return S.products.filter(p => {
    if (f.cat && (p.category || 'ไม่ระบุหมวด') !== f.cat) return false;
    if (f.flag === 'low' && !(p.trackStock === 'Y' && num(p.stock) <= num(p.lowStock || 0))) return false;
    if (f.flag === 'nobar' && p.barcode) return false;
    if (f.flag === 'nocost' && num(p.cost) > 0) return false;
    if (f.flag === 'best' && p.bestseller !== 'Y') return false;
    if (f.flag === 'fresh' && !/ของสด/.test(p.category || '') && p.byWeight !== 'Y') return false;
    return toks.every(t => p._n.includes(t));
  });
}

/* =========================================================
   Barcode: EAN-13 / EAN-8 (เขียนเอง) + Code128 (JsBarcode)
   ========================================================= */
const EAN = {

  G: ['0100111', '0110011', '0011011', '0100001', '0011101', '0111001', '0000101', '0010001', '0001001', '0010111'],
  R: ['1110010', '1100110', '1101100', '1000010', '1011100', '1001110', '1010000', '1000100', '1001000', '1110100'],
  P: ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'],
  check(d) { let s = 0; const a = d.split('').reverse(); a.forEach((c, i) => s += +c * (i % 2 ? 1 : 3)); return String((10 - s % 10) % 10); },

  bits(code) {
    if (code.length === 13) { const f = +code[0], par = this.P[f]; let b = '101'; for (let i = 1; i <= 6; i++) b += this[par[i - 1]][+code[i]]; b += '01010'; for (let i = 7; i <= 12; i++) b += this.R[+code[i]]; return b + '101'; }

  }
};
function internalBarcode(sku) {
  let d = String(sku || '').replace(/\D/g, '');
  if (!d) d = String(Date.now()).slice(-8);
  const body = '21' + d.slice(-10).padStart(10, '0');

}
function priceBarcode(sku, price) {
  const body = '20' + String(sku).replace(/\D/g, '').padStart(5, '0').slice(-5) + String(Math.round(num(price) * 100)).padStart(5, '0').slice(-5);
  return body + EAN.check(body);
}
/* วาดบาร์โค้ดลง canvas ctx ที่ x,y ขนาด w*h  คืนค่า true/false */
function drawBarcode(ctx, code, x, y, w, h, showText = true, fontPx = 18) {
  code = String(code || '').trim(); if (!code) return false;
  let bits;
  if (EAN.valid(code)) bits = EAN.bits(code);

    const enc = {}; try { JsBarcode(enc, code, { format: 'CODE128' }); } catch (e) { return false; }
    bits = enc.encodings.map(e => e.data).join('');
  } else return false;

  if (showText) { ctx.font = `600 ${fontPx}px "Noto Sans Thai",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(code, x + w / 2, y + h + 1); }

}

  pkt(cmd, data = []) { let c = cmd ^ data.length; data.forEach(b => c ^= b); return Uint8Array.from([0x55, 0x55, cmd, data.length, ...data, c & 0xff, 0xAA, 0xAA]); },

    }

function wrapText(ctx, text, maxW, maxLines) {
  const out = []; let line = '';
  const chars = Array.from(String(text));
  // ตัดคำแบบง่าย (ภาษาไทยไม่มีช่องว่าง) ใช้ Intl.Segmenter ถ้ามี
  let parts = chars;
  if (window.Intl && Intl.Segmenter) parts = Array.from(new Intl.Segmenter('th', { granularity: 'word' }).segment(text), s => s.segment);
  for (const w of parts) {
    if (ctx.measureText(line + w).width > maxW && line) { out.push(line); line = w.trimStart(); if (out.length === maxLines) break; }
    else line += w;
  }
  if (out.length < maxLines && line) out.push(line);
  if (out.length === maxLines && (out.join('').length < String(text).length)) { let l = out[maxLines - 1]; while (l && ctx.measureText(l + '…').width > maxW) l = l.slice(0, -1); out[maxLines - 1] = l + '…'; }
  return out;
}

/* =========================================================
   Camera scanner (BarcodeDetector → ZXing fallback)
   ========================================================= */
async function openScanner(onCode, opts = {}) {

  el.innerHTML = `<video playsinline muted></video><div class="frame"></div>
   <div class="bar"><button class="iconbtn" data-x>${I(IC.x, 26)}</button><div class="grow disp" style="font-size:17px">${esc(opts.title || 'สแกนบาร์โค้ด')}</div><button class="iconbtn" data-torch title="ไฟฉาย">${I(IC.bolt, 24)}</button></div>
   <div class="bot"><div class="last hidden"></div><div class="row"><input class="in grow" inputmode="numeric" placeholder="หรือพิมพ์/ยิงบาร์โค้ด แล้วกด Enter" style="background:rgba(255,255,255,.95)"><button class="btn" data-ok>ตกลง</button></div><div class="tiny center" style="margin-top:8px;opacity:.85" data-st>กำลังเปิดกล้อง...</div></div>`;
  document.body.appendChild(el);
  const video = $('video', el), st = $('[data-st]', el), inp = $('input', el);

/* =========================================================
   ภาษีเงินได้บุคคลธรรมดา (เงินได้ 40(8) ขายสินค้า)
   ========================================================= */
const TAX = {
  BR: [[150000, 0], [300000, .05], [500000, .10], [750000, .15], [1000000, .20], [2000000, .25], [5000000, .30], [Infinity, .35]],
  progressive(net) { let tax = 0, prev = 0; for (const [cap, r] of this.BR) { if (net <= prev) break; tax += (Math.min(net, cap) - prev) * r; prev = cap; } return Math.max(0, tax); },
  bracket(net) { let prev = 0; for (const [cap, r] of this.BR) { if (net <= cap) return r; prev = cap; } return .35; },
  calc({ gross, actualExp, allowance, half }) {
    const flatExp = gross * .6;
    const minThreshold = half ? 60000 : 120000;
    const one = exp => {
      const net = Math.max(0, gross - exp - allowance);
      const t1 = this.progressive(net);
      const t2 = gross >= minThreshold ? gross * .005 : 0;
      const tax = t2 > 5000 ? Math.max(t1, t2) : t1;
      return { exp, net, t1, t2, tax, usedMin: t2 > 5000 && t2 > t1, rate: this.bracket(net) };
    };
    const flat = one(flatExp), actual = one(actualExp);
    return { flat, actual, best: actual.tax < flat.tax ? 'actual' : 'flat' };
  },
  deadlines(today = todayISO()) {
    const y = +today.slice(0, 4), out = [];
    for (const yy of [y, y + 1]) {
      out.push({ form: 'ภ.ง.ด.90', period: String(yy - 1), what: 'ภาษีทั้งปี ' + (yy - 1 + 543), paper: `${yy}-03-31`, online: `${yy}-04-08` });
      out.push({ form: 'ภ.ง.ด.94', period: yy + '-H1', what: 'ภาษีครึ่งปี ม.ค.–มิ.ย. ' + (yy + 543), paper: `${yy}-09-30`, online: `${yy}-10-08` });
    }
    return out.filter(d => d.online >= today).sort((a, b) => a.paper.localeCompare(b.paper)).slice(0, 2);
  }
};

function parseReceiptText(text) {

  });

}

/* ---------- เต็มจอ + สลับผู้ใช้ ---------- */
const FS = {
  get el() { return document.fullscreenElement || document.webkitFullscreenElement; },
  get supported() { return !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen); },
  get installed() { return matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; },
  btn(cls) { return `<button class="iconbtn tb fsb ${cls || ''}" onclick="FS.toggle()" title="Full screen">${I(this.el ? IC.shrink : IC.expand, 22)}</button>`; },
  async toggle() {
    try {
      if (this.el) { await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen()); return; }
      if (this.supported) {
        const d = document.documentElement; await (d.requestFullscreen ? d.requestFullscreen({ navigationUI: 'hide' }) : d.webkitRequestFullscreen());
        LS.set('wantFS', true); try { screen.orientation && screen.orientation.lock && 0; } catch (e) { } return;
      }
    } catch (e) { }
    this.help();
  },
  help() {
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && 'ontouchend' in document);
    sheet('Full screen', `<p class="small">${ios ? 'iPhone/iPad ไม่รองรับปุ่มเต็มจอในเบราว์เซอร์ — ให้ติดตั้งเป็นแอปแทน แล้วเปิดจากไอคอนบนหน้าจอโฮม จะเต็มจอทุกครั้ง' : 'เบราว์เซอร์นี้ไม่รองรับปุ่มเต็มจอ — ให้ติดตั้งเป็นแอป'}</p>
      <div class="card small">${ios ? '<b>Safari</b> › ปุ่มแชร์ (สี่เหลี่ยมลูกศรขึ้น) › <b>เพิ่มไปยังหน้าจอโฮม</b> (Add to Home Screen)' : '<b>Chrome</b> › ⋮ › <b>ติดตั้งแอป</b> หรือ <b>เพิ่มลงในหน้าจอหลัก</b> (Install app / Add to Home screen)'}</div>`);
  },
  sync() { $$('.fsb').forEach(b => b.innerHTML = I(this.el ? IC.shrink : IC.expand, 22)); if (this.installed && !this.supported) $$('.fsb').forEach(b => b.style.display = 'none'); }
};
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { FS.sync(); if (!FS.el) LS.set('wantFS', false); }));
// ถ้าเคยเปิดเต็มจอ: แตะหน้าจอครั้งแรกหลังเปิดแอป จะกลับเข้าเต็มจอให้อัตโนมัติ (เบราว์เซอร์อนุญาตเฉพาะตอนผู้ใช้แตะ)
addEventListener('pointerdown', e => { if (LS.get('wantFS', false) && !FS.el && FS.supported && !(e.target.closest && e.target.closest('.fsb'))) FS.toggle(); }, { capture: true });

function stockDlg(p) {
  const ov = sheet('ปรับสต็อก: ' + esc(p.name), `<div class="seg" id="md"><button class="on" data-m="add">รับเข้า +</button><button data-m="sub">เบิก/เสีย −</button><button data-m="set">ตั้งค่าที่นับได้</button></div>
   <label class="f" style="margin-top:12px"><span>จำนวน</span><input class="in" id="qq" type="number" inputmode="decimal" step="any"></label><div class="small muted">คงเหลือปัจจุบัน: <b>${num(p.stock)}</b></div>`, `<button class="btn block" id="ok">บันทึก</button>`);
  let m = 'add'; $$('#md button', ov).forEach(b => b.onclick = () => { m = b.dataset.m; $$('#md button', ov).forEach(x => x.classList.toggle('on', x === b)); });
  $('#qq', ov).focus();
  $('#ok', ov).onclick = async () => {
    const q = num($('#qq', ov).value); const cur = num(p.stock); const v = m === 'add' ? cur + q : m === 'sub' ? cur - q : q;
    try { busy(1); await adjustStock([{ sku: p.sku, stock: v }]); busy(0); ov.remove(); toast('บันทึกสต็อกแล้ว: ' + v); if (S.view === 'products') go('products'); } catch (e) { busy(0); toast(e.message, 1); }
  };
}
async function adjustStock(rows) {
  const r = await api('adjustStock', { rows });
  r.rows.forEach(x => { const p = IDX.bySku[x.sku]; if (p) { p.stock = x.stock; p.trackStock = 'Y'; } }); LS.set('products', S.products);
}
async function saveProducts(rows) {
  const clean = rows.map(r => { const o = {}; Object.keys(r).forEach(k => { if (k[0] !== '_') o[k] = r[k]; }); return o; });
  await api('upsert', { table: 'Products', rows: clean });
  clean.forEach(r => { const i = S.products.findIndex(p => p.sku === r.sku); if (i >= 0) S.products[i] = { ...S.products[i], ...r }; else S.products.unshift(r); });
  LS.set('products', S.products); buildIndex();
}
function editProduct(p0) {
  const isNew = !p0 || !p0.sku;
  const p = { byWeight: 'N', trackStock: 'N', available: 'Y', bestseller: 'N', ...(p0 || {}) };
  if (isNew) p.sku = nextSku(S.products);
  const cats = [...new Set(S.categories.map(c => c.name).concat(S.products.map(x => x.category)).filter(Boolean))].sort();
  let newImg = null, rmImg = false;
  const curImg = window.Img ? Img.get(p.sku) : '';
  const ov = sheet(isNew ? 'เพิ่มสินค้าใหม่' : 'แก้ไขสินค้า', `
    <div class="row" style="margin-bottom:12px;gap:12px"><div id="pimg" style="width:84px;height:84px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink3);flex:none">${curImg ? `<img src="${curImg}" style="width:100%;height:100%;object-fit:cover">` : I(IC.image, 30)}</div>
      <div class="grow"><div class="small" style="font-weight:600">รูปสินค้า (แสดงบนหน้าจอขาย)</div><div class="row wrap" style="margin-top:6px"><label class="btn ghost sm">${I(IC.cam, 16)} ถ่าย/เลือกรูป<input type="file" accept="image/*" id="f_img" class="hidden"></label><button class="btn ghost sm" id="rmimg">ลบรูป</button></div><div class="tiny muted">ย่อขนาดอัตโนมัติ ~10 KB โหลดเร็ว</div></div></div>
    <label class="f"><span>ชื่อสินค้า *</span><input class="in" id="f_name" value="${esc(p.name)}"></label>
    <div class="f" style="margin-bottom:10px"><span style="display:block;font-size:13px;color:var(--ink2);margin-bottom:4px;font-weight:500">บาร์โค้ด <span class="tiny muted">· ยิงด้วยเครื่อง / แตะ 📷 ถ่ายรูป / แตะสแกนสด</span></span><div class="row">${barcodeFieldHTML('f_barcode', p.barcode)}<button class="btn sm" id="bscan" title="สแกนด้วยกล้องแบบสด">${I(IC.scan, 18)}</button><button class="btn ghost sm" id="bgen" title="สร้างบาร์โค้ดภายในร้าน">สร้าง</button></div><div class="tiny muted" id="bmsg"></div></div>
    <div class="grid2"><label class="f"><span>ราคาขาย *</span><input class="in" id="f_price" type="number" inputmode="decimal" step="any" value="${esc(p.price)}"></label>
    <label class="f ${can('viewCost') ? '' : 'hidden'}"><span>ต้นทุน</span><input class="in" id="f_cost" type="number" inputmode="decimal" step="any" value="${esc(p.cost)}"></label></div>
    <label class="f"><span>หมวดหมู่</span><input class="in" id="f_category" list="catl" value="${esc(p.category)}"><datalist id="catl">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist></label>
    <div class="grid2"><label class="f"><span>รหัส SKU</span><input class="in" id="f_sku" value="${esc(p.sku)}" ${isNew ? '' : 'readonly'}></label>
    <label class="f"><span>หน่วย</span><input class="in" id="f_unit" placeholder="ชิ้น/แพ็ค/กก." value="${esc(p.unit)}"></label></div>
    <div class="card" style="padding:10px 12px">
      <label class="row" style="margin-bottom:8px"><input type="checkbox" id="f_trackStock" ${p.trackStock === 'Y' ? 'checked' : ''}> <span class="grow">นับสต็อก</span></label>
      <div class="grid2" id="stk"><label class="f"><span>คงเหลือ</span><input class="in" id="f_stock" type="number" step="any" value="${esc(p.stock)}"></label><label class="f"><span>เตือนเมื่อเหลือ ≤</span><input class="in" id="f_lowStock" type="number" step="any" value="${esc(p.lowStock)}"></label></div>
      <label class="row" style="margin-bottom:8px"><input type="checkbox" id="f_byWeight" ${p.byWeight === 'Y' ? 'checked' : ''}> <span class="grow">ขายตามน้ำหนัก (ของสด)</span></label>
      <label class="row" style="margin-bottom:8px"><input type="checkbox" id="f_bestseller" ${p.bestseller === 'Y' ? 'checked' : ''}> <span class="grow">สินค้าขายดี</span></label>
      <label class="row"><input type="checkbox" id="f_available" ${p.available !== 'N' ? 'checked' : ''}> <span class="grow">เปิดขาย</span></label>
    </div>
    <label class="f"><span>อายุสินค้า (วัน) — ใช้พิมพ์วันหมดอายุบนฉลากของสด</span><input class="in" id="f_shelfLifeDays" type="number" value="${esc(p.shelfLifeDays)}"></label>
    <label class="f"><span>หมายเหตุ</span><input class="in" id="f_note" value="${esc(p.note)}"></label>
    ${!isNew && isOwner() ? `<button class="btn ghost sm" id="del" style="color:var(--red)">${I(IC.trash, 16)} ลบสินค้านี้</button>` : ''}`,
    `<button class="btn ghost grow" id="svp">บันทึก + พิมพ์ฉลาก</button><button class="btn grow" id="sv">บันทึก</button>`);
  const chk = () => {
    const b = $('#f_barcode', ov).value.trim(); let m = '';
    if (b) { const dup = S.products.find(x => x.sku !== p.sku && String(x.barcode) === b); if (dup) m = `<span style="color:var(--red)">⚠ บาร์โค้ดซ้ำกับ: ${esc(dup.name)}</span>`; else if (/^\d{13}$/.test(b) && !EAN.valid(b)) m = '⚠ เลขตรวจสอบ EAN-13 ไม่ถูกต้อง'; }
    $('#bmsg', ov).innerHTML = m;
  };
  $('#f_barcode', ov).oninput = chk; chk();
  $('#f_img', ov).onchange = async e => { const f = e.target.files[0]; if (!f) return; newImg = await Img.shrink(f); rmImg = false; $('#pimg', ov).innerHTML = `<img src="${newImg}" style="width:100%;height:100%;object-fit:cover">`; };
  $('#rmimg', ov).onclick = () => { newImg = null; rmImg = true; $('#pimg', ov).innerHTML = I(IC.image, 30); };
  $('#bscan', ov).onclick = () => openScanner(code => { $('#f_barcode', ov).value = code; chk(); return 'close'; });
  bindBarcodeField(ov, 'f_barcode', () => chk());
  $('#bgen', ov).onclick = () => { $('#f_barcode', ov).value = internalBarcode($('#f_sku', ov).value); chk(); toast('สร้างบาร์โค้ดภายในร้าน (ขึ้นต้น 21)'); };
  const stkVis = () => $('#stk', ov).style.display = $('#f_trackStock', ov).checked ? '' : 'none';
  $('#f_trackStock', ov).onchange = stkVis; stkVis();
  const collect = () => {
    const o = { ...p }; ['name', 'barcode', 'price', 'cost', 'category', 'sku', 'unit', 'stock', 'lowStock', 'shelfLifeDays', 'note'].forEach(k => { const e = $('#f_' + k, ov); if (e) o[k] = e.value.trim(); });
    ['trackStock', 'byWeight', 'bestseller', 'available'].forEach(k => o[k] = $('#f_' + k, ov).checked ? 'Y' : 'N');
    if (!o.name) throw new Error('กรุณาใส่ชื่อสินค้า'); if (!o.sku) throw new Error('กรุณาใส่รหัส SKU');
    if (isNew && IDX.bySku[o.sku]) throw new Error('รหัส SKU นี้มีอยู่แล้ว');
    return o;
  };
  const save = async print => {
    let o; try { o = collect(); } catch (e) { return toast(e.message, 1); }
    try { busy(1, 'กำลังบันทึก...'); await saveProducts([o]);
      if (newImg) await Img.save(o.sku, newImg); else if (rmImg && curImg) await Img.remove(o.sku);
      if (o.category && !S.categories.some(c => c.name === o.category)) { await api('renameCategory', { from: '', to: o.category }); loadSettings(); }
      busy(0); ov.remove(); toast('บันทึกแล้ว'); if (print) go('labels', [o]); else if (S.view === 'products') go('products'); } catch (e) { busy(0); toast(e.message, 1); }
  };
  $('#sv', ov).onclick = () => save(false); $('#svp', ov).onclick = () => save(true);
  const d = $('#del', ov); if (d) d.onclick = async () => { if (!(await confirmDlg(`ลบ “${esc(p.name)}” ?`, 'ลบ', true))) return; try { busy(1); await api('remove', { table: 'Products', ids: [p.sku] }); S.products = S.products.filter(x => x.sku !== p.sku); LS.set('products', S.products); buildIndex(); busy(0); ov.remove(); go('products'); } catch (e) { busy(0); toast(e.message, 1); } };
  if (isNew) setTimeout(() => $('#f_name', ov).focus(), 200);
}

/* ---------- SCAN / PRICE CHECK ---------- */
VIEWS.scan = el => {
  el.innerHTML = vhead('สแกน / เช็คราคา') + `
   <div class="card center" style="padding:22px 14px">
     <button class="btn block" id="go" style="min-height:64px;font-size:18px">${I(IC.cam, 26)} เปิดกล้องสแกน</button>
     <div class="small muted" style="margin:12px 0 6px">หรือใช้เครื่องยิงบาร์โค้ด / พิมพ์รหัส</div>
     <input class="in" id="kb" inputmode="numeric" placeholder="ยิงบาร์โค้ดที่ช่องนี้" style="text-align:center;font-size:18px">
     <div class="seg" id="md" style="margin-top:12px"><button class="on" data-m="price">เช็คราคา</button><button data-m="stock">นับ/รับสต็อก</button><button data-m="label">คิวพิมพ์ฉลาก</button></div>
   </div>
   <div id="res"></div><div id="hist"></div>`;
  let mode = 'price'; const hist = [];
  $$('#md button', el).forEach(b => b.onclick = () => { mode = b.dataset.m; $$('#md button', el).forEach(x => x.classList.toggle('on', x === b)); });
  const show = (code, ctx) => {
    const f = findByCode(code);
    if (!f) {
      $('#res', el).innerHTML = `<div class="card"><div class="row"><div class="grow"><b>ไม่พบสินค้า</b><div class="small muted">บาร์โค้ด ${esc(code)}</div></div><button class="btn sm" id="add">${I(IC.plus, 16)} เพิ่มสินค้า</button></div></div>`;
      $('#add', el).onclick = () => editProduct({ barcode: code });
      ctx && ctx.showLast(`<b>ไม่พบ</b> ${esc(code)}`);
      return mode === 'price' ? 'close' : '';
    }
    const p = f.p;
    if (mode === 'stock') {
      p._cnt = (p._cnt || 0) + 1; hist.unshift(p);
      ctx && ctx.showLast(`<div class="row"><b class="grow">${esc(p.name)}</b><span class="tag green">+${p._cnt}</span></div>`);
      drawHist(); return '';
    }
    if (mode === 'label') { LQ.push({ p, copies: 1 }); ctx && ctx.showLast(`<b>${esc(p.name)}</b> เพิ่มเข้าคิวพิมพ์ (${LQ.length})`); drawHist(); return ''; }
    $('#res', el).innerHTML = `<div class="card center"><div class="small muted">${esc(p.sku)} · ${esc(p.barcode)}</div><h3 style="margin:6px 0">${esc(p.name)}</h3><div class="big-price">${baht(f.price != null ? f.price : p.price)}</div>
      ${p.trackStock === 'Y' ? `<div class="small" style="margin-top:6px">คงเหลือ ${num(p.stock)}</div>` : ''}<div class="row" style="margin-top:12px"><button class="btn ghost grow" id="e">แก้ไข</button><button class="btn ghost grow" id="l">พิมพ์ฉลาก</button></div></div>`;
    $('#e', el).onclick = () => editProduct(p); $('#l', el).onclick = () => go('labels', [p]);
    return 'close';
  };
  const drawHist = () => {
    if (mode === 'stock') {
      const uniq = [...new Set(hist)];
      $('#hist', el).innerHTML = uniq.length ? `<div class="card"><h3>รายการที่นับ (${uniq.length})</h3>${uniq.map(p => `<div class="kv"><span>${esc(p.name)}</span><b>${p._cnt}</b></div>`).join('')}
       <div class="seg" id="sm" style="margin-top:10px"><button class="on" data-m="add">บวกเพิ่มเข้าสต็อก</button><button data-m="set">ตั้งเป็นยอดที่นับได้</button></div>
       <button class="btn green block" id="ap" style="margin-top:10px">บันทึกสต็อก</button></div>` : '';
      let sm = 'add'; $$('#sm button', el).forEach(b => b.onclick = () => { sm = b.dataset.m; $$('#sm button', el).forEach(x => x.classList.toggle('on', x === b)); });
      const ap = $('#ap', el); if (ap) ap.onclick = async () => { try { busy(1); await adjustStock(uniq.map(p => ({ sku: p.sku, stock: sm === 'add' ? num(p.stock) + p._cnt : p._cnt }))); uniq.forEach(p => delete p._cnt); hist.length = 0; busy(0); drawHist(); toast('บันทึกสต็อกแล้ว'); } catch (e) { busy(0); toast(e.message, 1); } };
    } else if (mode === 'label') {
      $('#hist', el).innerHTML = LQ.length ? `<div class="card"><div class="row"><h3 class="grow">คิวพิมพ์ฉลาก (${LQ.length})</h3><button class="btn sm" onclick="go('labels')">ไปพิมพ์</button></div></div>` : '';
    }
  };
  $('#go', el).onclick = () => openScanner(show, { continuous: true, title: mode === 'price' ? 'เช็คราคา' : mode === 'stock' ? 'นับสต็อก (สแกนต่อเนื่อง)' : 'เพิ่มเข้าคิวพิมพ์' });
  const kb = $('#kb', el); kb.onkeydown = e => { if (e.key === 'Enter' && kb.value.trim()) { beep(); show(kb.value.trim()); kb.value = ''; } };
  Scanner.on('scan', code => { const r = show(code); if (findByCode(code)) beep(); else Scanner.err(); return r; });
  if (!S.products.length) loadProducts(true).catch(e => toast(e.message, 1)); else buildIndex();
  setTimeout(() => kb.focus(), 100);
};

   <div class="card center"><div class="small muted" style="margin-bottom:8px">ตัวอย่าง (ขนาดจริง 8 จุด/มม.)</div><canvas class="lbl" id="pv"></canvas></div>

function newReceipt() {
  const ov = sheet('เพิ่มใบเสร็จร้านค้าส่ง', `
    <p class="small muted" style="margin-top:0">ถ่ายรูปใบเสร็จให้เห็นรายการชัดเจน วางบนพื้นเรียบ แสงพอ — ระบบจะอ่านรายการสินค้าและให้ตรวจสอบก่อนบันทึก</p>
    <label class="btn block" style="min-height:64px;font-size:17px">${I(IC.cam, 24)} ถ่ายรูป / เลือกรูปใบเสร็จ<input type="file" accept="image/*,application/pdf" capture="environment" id="fi" class="hidden"></label>

    const f = e.target.files[0]; if (!f) return; ov.remove();
    try {
      busy(1, 'กำลังย่อรูป...'); const img = await compressImage(f);
      busy(1, 'กำลังอัปโหลดรูปเก็บใน Google Drive...');
      const up = await api('upload', { kind: 'receipt', name: `receipt_${todayISO()}_${Date.now()}.jpg`, mime: img.mime, base64: img.dataUrl });

      let data;

        const o = await api('ocr', { base64: img.dataUrl, mime: img.mime });
        data = o.data ? { ...o.data, items: (o.data.items || []).map(i => ({ ...i })) } : parseReceiptText(o.text || '');
        data._raw = o.text || ''; data._engine = o.engine;
      } catch (err) { data = { items: [] }; toast('อ่านข้อความไม่สำเร็จ: ' + err.message + ' — กรอกเองได้', 1); }
      if (!S.products.length) await loadProducts(true);
      buildIndex();
      const items = (data.items || []).map(it => {
        const m = matchProduct(it.name, it.code);
        return { name: it.name, code: it.code || '', qty: num(it.qty) || 1, unitCost: num(it.unitPrice) || (num(it.amount) / (num(it.qty) || 1)), amount: num(it.amount), sku: m ? m.p.sku : '', score: m ? m.score : 0, updateCost: !!m, addStock: false, createNew: false };
      });

    } catch (err) { busy(0); toast(err.message, 1); }
  };

function rowsToDaily(rows) {

  S.receipts = await loadTable('Receipts').catch(() => []);
  const tcfg = LS.get('taxCfg', { extraAllow: 0, paid94: {} });
  const MS = {};
  const render = async y => {
    y = +y; const inYear = (d, h) => String(d).startsWith(String(y)) && (!h || +String(d).slice(5, 7) <= 6);
    const ms = MS[y] || (MS[y] = await monthlySales(y)); S.taxMonths = ms;
    const sales = (h) => ms.filter(m => !h || m.i < 6).reduce((a, m) => a + m.amount, 0);
    const exps = (h) => S.receipts.filter(r => inYear(r.date, h)).reduce((a, r) => a + num(r.total), 0);
    const monthsWithSales = ms.filter(m => m.amount > 0).length;
    const noFile = S.receipts.filter(r => inYear(r.date) && !r.fileUrl).length;
    const G = sales(), E = exps(), GH = sales(1), EH = exps(1);
    const allow = 60000 + num(tcfg.extraAllow);
    const A = TAX.calc({ gross: G, actualExp: E, allowance: allow });
    const H = TAX.calc({ gross: GH, actualExp: EH, allowance: 30000 + num(tcfg.extraAllow) / 2, half: true });
    const curY = y === y0; const monthsPassed = curY ? +todayISO().slice(5, 7) : 12;
    const proj = monthsWithSales ? G / monthsWithSales * 12 : 0;
    const rec = [];
    if (!monthsWithSales) rec.push(['amber', 'ยังไม่มียอดขายของปีนี้ — ขายผ่านหน้า POS หรือกรอกที่ “ยอดขายรายเดือน” การคำนวณด้านล่างจะยังไม่ถูกต้อง']);
    else if (monthsWithSales < monthsPassed) rec.push(['amber', `บันทึกยอดขายแล้ว ${monthsWithSales} เดือน จาก ${monthsPassed} เดือน — กรอกให้ครบเพื่อความแม่นยำ`]);
    if (G > 1.8e6) rec.push(['red', `<b>ยอดขายเกิน 1,800,000 บาท/ปี แล้ว</b> — กฎหมายกำหนดให้จดทะเบียนภาษีมูลค่าเพิ่ม (VAT) ภายใน 30 วันนับจากวันที่รายรับเกิน จากนั้นต้องยื่น ภ.พ.30 ทุกเดือน ควรปรึกษาสรรพากรพื้นที่/นักบัญชีทันที`]);
    else if (proj > 1.8e6 || G > 1.44e6) rec.push(['amber', `คาดการณ์ยอดขายทั้งปี ≈ ${baht(proj)} ใกล้/เกินเกณฑ์ VAT 1.8 ล้าน — เตรียมความพร้อมจด VAT (ระบบใบกำกับภาษี, ปรับราคา)`]);
    if (A.best === 'actual' && E > 0) rec.push(['green', `วิธี <b>หักค่าใช้จ่ายตามจริง</b> เสียภาษีน้อยกว่าเหมา 60% ประมาณ ${baht(A.flat.tax - A.actual.tax)} — ต้องมีหลักฐานครบ (ใบเสร็จ/ใบกำกับ) และควรจัดทำบัญชีรายรับ-รายจ่าย`]);
    else if (G > 0) rec.push(['green', `วิธี <b>หักเหมา 60%</b> คุ้มกว่า/ง่ายกว่า (ค่าใช้จ่ายจริงที่มีหลักฐาน ${G ? (E / G * 100).toFixed(0) : 0}% ของยอดขาย) ไม่ต้องแนบหลักฐานค่าใช้จ่าย แต่ควรเก็บใบเสร็จไว้`]);

      <div class="tiny muted" style="margin-top:6px">วันยื่นออนไลน์ที่ขยายเวลาอาจเปลี่ยนแต่ละปี ตรวจสอบที่ rd.go.th · ยื่นช้ามีเงินเพิ่ม 1.5% ต่อเดือนของภาษีที่ต้องชำระ</div></div>
     <div class="card"><h3>สรุปปี ${y + 543}</h3>
      <div class="grid2"><div class="stat"><div class="k">ยอดขาย (เงินได้ 40(8))</div><div class="v">${baht(G)}</div></div><div class="stat"><div class="k">ค่าใช้จ่ายมีหลักฐาน</div><div class="v">${baht(E)}</div></div></div>
      <div class="scroll-x" style="margin-top:10px"><table class="t"><tr><th></th><th class="right">หักเหมา 60%</th><th class="right">หักตามจริง</th></tr>

       ${row('ภาษีแบบขั้นบันได', money(A.flat.t1), money(A.actual.t1))}${row('ภาษีแบบ 0.5% ของรายรับ', money(A.flat.t2), money(A.actual.t2))}

    <div class="grid2"><label class="f"><span>โทร</span><input class="in" id="s_phone" value="${esc(st.phone || '')}"></label><label class="f"><span>อีเมลรับแจ้งเตือน</span><input class="in" id="s_alertEmail" type="email" value="${esc(st.alertEmail || '')}"></label></div>
    <div class="row"><button class="btn grow" id="ss">บันทึก</button>${S.apiUrl ? '<button class="btn ghost grow" id="ta">ทดสอบส่งอีเมลแจ้งเตือน</button>' : ''}</div></div>` : ''}
   <div class="card"><h3>บัญชีของฉัน</h3><div class="kv"><span>ผู้ใช้</span><b>${esc(S.user.username)}</b></div>${isOwner() ? '<button class="btn ghost block" style="margin-top:8px" onclick="changePinDlg()">เปลี่ยนรหัสของฉัน</button>' : '<div class="tiny muted" style="margin-top:6px">ต้องการเปลี่ยนรหัส ให้เจ้าของร้านเปลี่ยนให้ที่เมนู พนักงาน</div>'}</div>
   <div class="card"><h3>การเชื่อมต่อ</h3><div class="kv"><span>ฐานข้อมูล</span><b>${S.apiUrl ? 'Google Sheet (ออนไลน์)' : 'โหมดทดลองในเครื่อง'}</b></div>
    ${own ? `<button class="btn ghost block" id="cn" style="margin-top:8px">เปลี่ยน URL เซิร์ฟเวอร์</button>` : ''}
    <button class="btn ghost block" id="cc" style="margin-top:8px">ล้างแคชในเครื่อง</button>
    <div class="tiny muted" style="margin-top:8px">กล้อง ${navigator.mediaDevices ? '✓' : '✗'} · ตัวอ่านบาร์โค้ดในตัว ${'BarcodeDetector' in window ? '✓' : '✗ (ใช้ ZXing)'} · Bluetooth ${navigator.bluetooth ? '✓' : '✗'} · v${APP_VER}</div></div>`;
  if (own) {
    $('#ss', el).onclick = async () => { const rows = ['shopName', 'storeLabel', 'address', 'phone', 'alertEmail'].map(k => ({ key: k, value: $('#s_' + k, el).value.trim() })); try { busy(1); await api('upsert', { table: 'Settings', rows }); await loadSettings(); busy(0); toast('บันทึกแล้ว'); } catch (e) { busy(0); toast(e.message, 1); } };
    const ta = $('#ta', el); if (ta) ta.onclick = async () => { try { busy(1); const r = await api('testAlert'); busy(0); toast(r.sent ? `ส่งอีเมลแล้ว (${r.sent} รายการ)` : 'ไม่มีรายการที่ต้องแจ้งเตือนใน 90 วัน'); } catch (e) { busy(0); toast(e.message, 1); } };
    $('#cn', el).onclick = connectDlg;
  }
  $('#cc', el).onclick = () => { LS.del('products'); LS.del('productsAt'); S.products = []; toast('ล้างแคชแล้ว'); };
};

/* ---------- BOOT ---------- */
/* ตรวจว่าไฟล์ระบบโหลดครบ ถ้าไม่ครบ (เช่นเบราว์เซอร์ยังจำไฟล์เก่า) ล้างแคชแล้วโหลดใหม่ 1 ครั้ง ถ้ายังไม่ครบ แจ้งชื่อไฟล์ที่ขาด */
function missingFiles() {
  const chk = { 'logic.js': () => typeof Logic !== 'undefined', 'cache.js': () => typeof Cache !== 'undefined', 'offline.js': () => typeof OfflineAuth !== 'undefined', 'scanner.js': () => typeof Scanner !== 'undefined', 'printer.js': () => typeof RP !== 'undefined', 'pos.js': () => typeof POS !== 'undefined', 'display.js': () => !!VIEWS.displayset, 'reports.js': () => !!VIEWS.reports, 'inventory.js': () => !!VIEWS.stockcount, 'people.js': () => !!VIEWS.staff, 'quality.js': () => !!VIEWS.dataquality, 'services.js': () => typeof svcMenu !== 'undefined', 'owner.js': () => !!VIEWS.home };
  return Object.keys(chk).filter(f => { try { return !chk[f](); } catch (e) { return true; } });
}
async function selfHeal(miss) {
  if (!sessionStorage.getItem('mm_heal')) {
    sessionStorage.setItem('mm_heal', '1');
    try { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); } catch (e) { }
    try { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (e) { }
    location.reload(); return;
  }
  app.innerHTML = `<div class="login"><div class="card" style="max-width:520px"><h3>ไฟล์ระบบโหลดไม่ครบ</h3><p>ไฟล์ที่ขาด: <b>${miss.join(', ')}</b></p><p class="small muted">ตรวจว่าไฟล์เหล่านี้อยู่หน้าแรกของ repo Maymini บน GitHub (ไม่อยู่ในโฟลเดอร์ย่อย) แล้วรอ 2–3 นาทีให้ GitHub อัปเดต</p><button class="btn block" onclick="sessionStorage.removeItem('mm_heal');location.reload()">ลองใหม่</button></div></div>`;
}
async function boot() {
  const miss = missingFiles(); if (miss.length) return selfHeal(miss);
  sessionStorage.removeItem('mm_heal');
  const h0 = (location.hash || '').slice(1);
  if (/^display/.test(h0) && VIEWS.display) return VIEWS.display(app, h0);
  if (!S.user || !S.token) return renderLogin();
  document.onkeydown = null;
  shell(); buildIndex();
  const first = loadSettings();
  if (!S.settings.shopName || !Object.keys(S.perms || {}).length) await first;
  window.Sync && Sync.start();
  const v = isKiosk() ? 'pos' : (h0 || 'home');
  go(VIEWS[v] ? v : 'home');
  IdleLock.start(); window.warmCache && warmCache();
  document.dispatchEvent(new Event('mm:booted'));
}
/* ล็อกหน้าจอเมื่อไม่ได้ใช้งาน (กันคนอื่นใช้สิทธิ์เจ้าของบนเครื่องที่วางไว้หน้าร้าน) */
const IdleLock = {
  last: Date.now(),
  start() {
    if (this.on) return; this.on = true;
    ['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, () => this.last = Date.now(), { passive: true }));
    setInterval(() => {
      if (!S.user) return;
      const mins = num(cfg('idleLock', '10'));
      const applies = S.user.role === 'owner' || !isKiosk();
      if (mins > 0 && applies && Date.now() - this.last > mins * 60e3) { Elev.clear(); toast('ล็อกหน้าจออัตโนมัติ (ไม่ได้ใช้งาน ' + mins + ' นาที)'); logout(); }
    }, 20e3);
  }
};
window.addEventListener('online', () => { S.online = true; const n = $('.net'); n && n.classList.remove('off'); });
window.addEventListener('offline', () => { S.online = false; const n = $('.net'); n && n.classList.add('off'); });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (S.user && VIEWS[v] && v !== S.view) go(v); });
loadScript('https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js', 'JsBarcode').catch(() => { });
</script>

<script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // updateViaCache:'none' = ตรวจหาเวอร์ชันใหม่จากเซิร์ฟเวอร์ทุกครั้ง · ได้เวอร์ชันใหม่แล้วโหลดหน้าใหม่ 1 ครั้ง (ยกเว้นกำลังชำระเงิน)
  const hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { setInterval(() => r.update().catch(() => { }), 30 * 60e3); }).catch(() => { });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadCtl || window.__swReloaded) return; const again = () => { if (window.POS && POS.pay && !POS.pay.done) return setTimeout(again, 5000); window.__swReloaded = 1; location.reload(); }; again(); });
}

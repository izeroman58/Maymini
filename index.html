<script>/* ฟอนต์ที่เจ้าของร้านเลือก (ใช้ก่อนวาดหน้า กันกระพริบ) · ค่าเริ่มต้น = สารบรรณ (Sarabun) */try{var f=JSON.parse(localStorage.getItem("mm_uiFont")||"null")||{};var fam=function(k){return(!k||k==="Loyverse"||k==="Noto Sans Thai Looped")?"'Sarabun'":"'"+k+"'";};var r=document.documentElement.style;r.setProperty("--fb",fam(f.body)+",'Noto Sans Thai',system-ui,sans-serif");r.setProperty("--fh",fam(f.head||f.body)+",'Noto Sans Thai',system-ui,sans-serif");r.setProperty("--fs",(15*(f.scale||1))+"px");}catch(e){}</script>
<style>
:root{
  --fb:"Sarabun","Noto Sans Thai",system-ui,sans-serif; --fh:"Sarabun","Noto Sans Thai",system-ui,sans-serif; --flogo:"Prompt","Noto Sans Thai",sans-serif; --fs:15px;
  --red:#D6001C; --red-d:#A80016; --red-l:#FFE9EC; --green:#0B8A3E; --green-l:#E5F5EC;
  --ink:#1D1B1C; --ink2:#5E5759; --ink3:#9A9294; --line:#ECE6E7; --bg:#F7F4F2; --card:#fff;
  --amber:#B86E00; --amber-l:#FFF3DC; --blue:#1F5FBF; --blue-l:#E8F0FC;
  --r:16px; --sh:0 1px 2px rgba(60,20,25,.06),0 4px 16px rgba(60,20,25,.06);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.5 var(--fb);overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{overflow-x:clip}
/* หน้าขาย/จอลูกค้า: ล็อกพอดีจอ ไม่เลื่อนขึ้นลง */
html:has(body.full),body.full{height:100%;overflow:hidden}body.full #app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}body.full #view{flex:1;min-height:0;overflow:hidden;width:100%;max-width:none;margin:0}body.full #view>.pos{height:100%}
h1,h2,h3,.disp{font-family:var(--fh);margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hidden{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;padding:calc(10px + var(--safe-t)) 16px 12px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:baseline;gap:4px;font-family:var(--flogo);font-weight:800;letter-spacing:-.5px}
.logo small{font-size:12px;font-weight:600;opacity:.9}
.logo b{font-size:24px;font-style:italic}
.logo i{font-size:11px;font-style:italic;font-weight:600;opacity:.85;margin-left:2px}
.top .sp{flex:1}
.top .who{font-size:12px;text-align:right;line-height:1.2;opacity:.95}
.chip-role{display:inline-block;background:rgba(255,255,255,.2);border-radius:99px;padding:1px 8px;font-size:11px;margin-top:2px}
.net{width:8px;height:8px;border-radius:50%;background:#7CF0A6;display:inline-block;margin-right:4px}
.net.off{background:#FFC24B}
/* layout */
main{max-width:860px;margin:0 auto;padding:14px 14px calc(96px + var(--safe-b))}
.vhead{display:flex;align-items:center;gap:10px;margin:4px 2px 12px}
.vhead h2{font-size:21px;flex:1}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:8px}
.muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:8px;align-items:center} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:420px){.grid4{grid-template-columns:repeat(2,1fr)}}
.right{text-align:right} .center{text-align:center}
.num{font-variant-numeric:tabular-nums}
/* buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--red);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;transition:transform .08s,filter .15s}

.btn.green{background:var(--green)} .btn.soft{background:var(--red-l);color:var(--red-d)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.iconbtn{border:0;background:transparent;padding:8px;border-radius:10px;cursor:pointer;display:inline-flex}

.top .iconbtn{color:#fff}

/* inputs */

.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:44px;outline:none}

.search{position:relative}

.stat{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--sh)}

.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}

.alert.red{background:var(--red-l);color:#7A0010} .alert.amber{background:var(--amber-l);color:#6B4000} .alert.green{background:var(--green-l);color:#05502A} .alert.blue{background:var(--blue-l);color:#123B78}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--safe-b))}

/* sheet / modal */
.ov{position:fixed;inset:0;background:rgba(20,10,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
@keyframes fi{from{opacity:0}}
@keyframes su{from{transform:translateY(30px);opacity:.4}}

.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:su .2s}

/* scanner */

.drw{position:fixed;top:0;bottom:0;left:0;width:min(330px,86vw);background:#fff;color:var(--ink);z-index:89;transform:translateX(-104%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.25);padding-top:var(--safe-t)}

body.navdock #app{padding-left:min(330px,86vw)}body.navdock .nav{left:min(330px,86vw)}
.drw .dh{display:flex;align-items:center;gap:8px;padding:10px 8px 10px 16px;background:var(--red);color:#fff;min-height:64px}.drw .dlogo{flex:1;min-width:0}.drw .dh .iconbtn{color:#fff}

.drw .dch{color:var(--ink3);transition:transform .18s;display:flex}.drw .dgrp.open .dch{transform:rotate(180deg)}.drw .dgrp.open>.dg{color:var(--red)}.drw .dgrp.open>.dg .dic{color:var(--red)}

.drw .drag{background:#fff!important;box-shadow:0 6px 18px rgba(0,0,0,.22);border-radius:10px;position:relative;z-index:2;opacity:.95}.drw .dhint{font-size:11.5px;color:var(--ink3);padding:4px 18px 8px}
.drw.inl{position:static;transform:none;width:auto;box-shadow:none;border-radius:18px;overflow:hidden;background:#fff;z-index:auto;padding:0}.drw.inl .db{overflow:visible}

function ownerPinDlg(reason, apOK) {
  return new Promise(res => {

async function api(action, payload = {}, _retry) {
  if (Elev.ok && !payload.ownerPin) payload = { ...payload, ownerPin: Elev.pin };
  try { const r = await apiRaw(action, payload); window.cacheAfterWrite && cacheAfterWrite(action, payload); return r; }
  catch (e) {
    if (/^PIN_(REQUIRED|BAD)/.test(e.message) && !_retry && S.user && S.user.role !== 'owner') {
      if (/^PIN_BAD/.test(e.message)) { Elev.clear(); toast(e.message.replace(/^PIN_BAD:\s*/, ''), 1); }
      const was = busyEl ? $('div', busyEl) && $('div', busyEl).textContent : null; busy(0);
      const pin = await ownerPinDlg(e.message.replace(/^PIN_\w+:\s*/, ''));
      if (!pin) throw new Error('ยกเลิก — ต้องใช้รหัสเจ้าของร้าน');
      if (was) busy(1, was);
      const r = await api(action, { ...payload, ownerPin: pin }, true);
      Elev.set(pin, ELEV_AREA.includes(S.view) ? 'products' : ''); return r;

async function apiRaw(action, payload, tokenOverride) {
  if (!S.apiUrl) return Local.handle(action, payload);
  let res;
  // ตัดเวลารอ: Wi-Fi ต่ออยู่แต่ไม่มีเน็ต จะไม่ค้าง (งานหนักให้เวลานานกว่า)
  const slow = /^(upload|ocr|importProducts|applyReceipt|finishCount|syncOrders|ordersRange|salesMonthly|list|dailySummary)$/.test(action) || (payload && payload.rows && payload.rows.length > 50);
  const ac = window.AbortController ? new AbortController() : null, tm = ac && setTimeout(() => ac.abort(), slow ? 90000 : 15000);
  try {
    if (navigator.onLine === false) throw new Error('offline');
    res = await fetch(S.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload, token: tokenOverride || S.token, deviceId: S.device.id }), signal: ac ? ac.signal : undefined });
  } catch (e) { const er = new Error(e.name === 'AbortError' ? 'อินเทอร์เน็ตช้า/ไม่ตอบสนอง — ลองใหม่อีกครั้ง' : 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ต'); er.offline = true; Net.set(false); throw er; }
  finally { tm && clearTimeout(tm); }
  Net.set(true);
  let j; try { j = await res.json(); } catch (e) { const er = new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (ตรวจ URL / การ Deploy)'); er.offline = true; throw er; }
  if (!j.ok) {
    if (/^AUTH:/.test(j.error)) {
      // ระหว่างเข้าระบบแบบเร็ว โทเคนเดิมอาจหมดอายุ → รอการยืนยันเบื้องหลังได้โทเคนใหม่แล้วลองอีกครั้ง
      if (S.loginP && !tokenOverride && action !== 'login') { const ok = await S.loginP.then(() => true, () => false); if (ok) return apiRaw(action, payload, S.token); }
      if (tokenOverride) throw new Error(j.error.replace('AUTH: ', ''));
      logout(true); throw new Error(j.error.replace('AUTH: ', ''));
    }
    throw new Error(j.error || 'เกิดข้อผิดพลาด');
  }
  return j;
}

  if (IDX.byBarcode[code]) return { p: IDX.byBarcode[code] };
  if (/^\d{12}$/.test(code) && IDX.byBarcode['0' + code]) return { p: IDX.byBarcode['0' + code] };
  if (/^0\d{12}$/.test(code) && IDX.byBarcode[code.slice(1)]) return { p: IDX.byBarcode[code.slice(1)] };

  if (/^20\d{11}$/.test(code)) { const item = code.slice(2, 7), price = Number(code.slice(7, 12)) / 100; const p = S.products.find(x => String(x.sku).padStart(5, '0').slice(-5) === item); if (p) return { p, price }; }

function searchProducts(q, f = {}) {

/* =========================================================

    if (/vat|ภาษีมูลค่าเพิ่ม/i.test(l) && !/รวม/.test(l)) { const ns = (l.match(NUM) || []).map(num).filter(n => n !== 7); if (ns.length) res.vat = ns[ns.length - 1]; }
  });
  let pendingName = '';
  lines.forEach(l => {
    if (SKIP.test(l)) { pendingName = ''; return; }
    const bc = (l.match(/(?<!\d)(\d{8}|\d{12,14})(?!\d)/) || [])[1] || '';
    let rest = bc ? l.replace(bc, ' ') : l;
    const tailM = rest.match(/(?:\s+[-\d.,@x×X*=:|฿]+)+\s*$/);
    const tail = tailM ? tailM[0] : (/^[\s\d.,@x×*=:|฿-]+$/.test(rest) ? rest : '');
    const nums = (tail.match(NUM) || []).map(num).filter(n => n >= 0);
    let name = (tailM ? rest.slice(0, tailM.index) : tail ? '' : rest).replace(/\s+/g, ' ').trim();
    const hasText = /[ก-๙a-z]{2,}/i.test(name);
    if (!nums.length) { if (hasText) pendingName = name; return; }
    if (!hasText && pendingName) { name = pendingName; }
    if (!/[ก-๙a-z]{2,}/i.test(name)) return;
    pendingName = '';
    let qty = 1, unit = 0, amt = nums[nums.length - 1];
    if (nums.length >= 3) { const a = nums[nums.length - 3], b = nums[nums.length - 2]; if (Math.abs(a * b - amt) < .6) { qty = a; unit = b; } else if (Math.abs(b * a - amt) < .6) { qty = a; unit = b; } else { qty = a || 1; unit = amt / (qty || 1); } }
    else if (nums.length === 2) { const a = nums[0]; if (a > 0 && a < 1000 && Number.isInteger(a) && amt / a >= 1) { qty = a; unit = amt / a; } else { unit = amt; } }
    else unit = amt;
    if (amt <= 0 || amt > 500000) return;
    res.items.push({ code: bc, name, qty, unitPrice: Math.round(unit * 100) / 100, amount: amt });
  });
  return res;
}

const durTxt = ms => { const m = Math.max(0, Math.round(ms / 60000)); return `${Math.floor(m / 60)} ชม. ${m % 60} นาที`; };
const tms = t => new Date(String(t || '').replace(' ', 'T').slice(0, 19) + '+07:00').getTime();
const hhmm = iso => String(iso || '').slice(11, 16);

/* ---------- ลงเวลาทำงาน (ทำงานได้แม้ออฟไลน์: เก็บคิวแล้วส่งตามหลัง) ---------- */
const Clock = {
  get map() { return LS.get('shifts', {}); },
  get(uid) { return this.map[uid] || null; },
  setLocal(uid, sh) { const m = this.map; if (sh) m[uid] = sh; else delete m[uid]; LS.set('shifts', m); },
  async act(action) {
    const at = nowLocal(), u = S.user;
    try { const r = await apiRaw(action, { deviceId: S.device.id, at }); this.setLocal(u.id, action === 'clockIn' ? r.shift : null); S.shift = action === 'clockIn' ? r.shift : null; return r.shift; }
    catch (e) {
      if (!e.offline) { if (/ไว้แล้ว/.test(e.message)) { const r = await apiRaw('myShift', {}).catch(() => null); if (r && r.shift) { this.setLocal(u.id, r.shift); S.shift = r.shift; return r.shift; } } throw e; }
      const box = LS.get('clockbox', []); box.push({ action, at, token: S.token, uid: u.id }); LS.set('clockbox', box);
      const sh = action === 'clockIn' ? { inAt: at, outAt: '', name: u.name, username: u.username, offline: 1 } : { ...(this.get(u.id) || {}), outAt: at };
      this.setLocal(u.id, action === 'clockIn' ? sh : null); S.shift = action === 'clockIn' ? sh : null; return sh;
    }
  },
  // ลงเวลาเข้างานทันทีในเครื่อง แล้วส่งขึ้นระบบเบื้องหลัง (ไม่ต้องรอเน็ต)
  inFast() {
    const at = nowLocal(), u = S.user, sh = { inAt: at, outAt: '', name: u.name, username: u.username };
    this.setLocal(u.id, sh); S.shift = sh;
    const box = LS.get('clockbox', []); box.push({ action: 'clockIn', at, token: S.token, uid: u.id }); LS.set('clockbox', box);
    setTimeout(() => this.flush().catch(() => { }), 50); return sh;
  },
  async flush() {
    if (this.busy) return; const box = LS.get('clockbox', []); if (!box.length) return;
    this.busy = true; const left = [];
    try {
      if (S.loginP) await S.loginP.catch(() => { });
      for (const ev of box) {
        const tk = S.user && ev.uid === S.user.id ? S.token : ev.token;
        try { await apiRaw(ev.action, { deviceId: S.device.id, at: ev.at }, tk); } catch (e) { if (e.offline) left.push(ev); }
      }

  }
};

const FS = {
  get el() { return document.fullscreenElement || document.webkitFullscreenElement; },
  get supported() { return !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen); },
  get installed() { return matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; },
  btn(cls) { return `<button class="iconbtn tb fsb ${cls || ''}" onclick="FS.toggle()" title="Full screen">${I(this.el ? IC.shrink : IC.expand, 22)}</button>`; },
  async toggle() {

    ${!isNew && isOwner() ? `<button class="btn ghost sm" id="del" style="color:var(--red)">${I(IC.trash, 16)} ลบสินค้านี้</button>` : ''}`,

  const chk = () => {
    const b = $('#f_barcode', ov).value.trim(); let m = '';
    if (b) { const dup = S.products.find(x => x.sku !== p.sku && String(x.barcode) === b); if (dup) m = `<span style="color:var(--red)">⚠ บาร์โค้ดซ้ำกับ: ${esc(dup.name)}</span>`; else if (/^\d{13}$/.test(b) && !EAN.valid(b)) m = '⚠ เลขตรวจสอบ EAN-13 ไม่ถูกต้อง'; }
    $('#bmsg', ov).innerHTML = m;
  };
  $('#f_barcode', ov).oninput = chk; chk();
  $('#f_img', ov).onchange = async e => { const f = e.target.files[0]; if (!f) return; newImg = await Img.shrink(f); rmImg = false; $('#pimg', ov).innerHTML = `<img src="${newImg}" style="width:100%;height:100%;object-fit:cover">`; };

  $('#webimg', ov).onclick = () => webImagePicker({ name: $('#f_name', ov).value.trim() || p.name, barcode: ($('#f_barcode', ov) || {}).value || p.barcode }, d => { newImg = d; rmImg = false; $('#pimg', ov).innerHTML = `<img src="${d}" style="width:100%;height:100%;object-fit:cover">`; });
  // แนะนำชื่อสินค้าจากบาร์โค้ด (สินค้าใหม่ = ค้นให้เอง · สินค้าเดิม = กด ✨ แนะนำชื่อ)
  const NS = nameSuggest(ov, { name: $('#f_name', ov), barcode: () => $('#f_barcode', ov).value.trim(), self: p.sku, box: $('#nsug', ov) });
  $('#nsgo', ov).onclick = () => NS.run(true);
  if (isNew && p.barcode) NS.run();
  $('#f_barcode', ov).addEventListener('input', () => { if (isNew || NS.shown) NS.soon(); });
  $('#bscan', ov).onclick = () => openScanner(code => { $('#f_barcode', ov).value = code; chk(); NS.run(); return 'close'; });
  bindBarcodeField(ov, 'f_barcode', () => { chk(); NS.run(); });
  $('#bgen', ov).onclick = () => { $('#f_barcode', ov).value = internalBarcode($('#f_sku', ov).value); chk(); toast('สร้างบาร์โค้ดภายในร้าน (ขึ้นต้น 21)'); };
  const stkVis = () => $('#stk', ov).style.display = $('#f_trackStock', ov).checked ? '' : 'none';
  $('#f_trackStock', ov).onchange = stkVis; stkVis();
  const collect = () => {
    const o = { ...p }; ['name', 'barcode', 'price', 'cost', 'category', 'sku', 'unit', 'stock', 'lowStock', 'shelfLifeDays', 'note'].forEach(k => { const e = $('#f_' + k, ov); if (e) o[k] = e.value.trim(); });

    if (isNew && IDX.bySku[o.sku]) throw new Error('รหัส SKU นี้มีอยู่แล้ว');
    return o;
  };

    let o; try { o = collect(); } catch (e) { return toast(e.message, 1); }

      if (newImg) await Img.save(o.sku, newImg); else if (rmImg && curImg) await Img.remove(o.sku);

  };

}

     <button class="btn block" id="go" style="min-height:64px;font-size:18px">${I(IC.cam, 26)} เปิดกล้องสแกน</button>
     <div class="small muted" style="margin:12px 0 6px">หรือใช้เครื่องยิงบาร์โค้ด / พิมพ์รหัส</div>
     <input class="in" id="kb" inputmode="numeric" placeholder="ยิงได้เลย ไม่ต้องแตะช่อง · หรือแตะเพื่อพิมพ์รหัส" style="text-align:center;font-size:18px">
     <div class="seg" id="md" style="margin-top:12px"><button class="on" data-m="price">เช็คราคา</button><button data-m="stock">นับ/รับสต็อก</button><button data-m="label">คิวพิมพ์ฉลาก</button></div>
   </div>
   <div id="hist"></div>`;
  // ผลเช็คราคาอยู่บนสุด (เห็นทันทีไม่ต้องเลื่อน) · รูปซ้าย รายละเอียดขวา
  $('.card', el).insertAdjacentHTML('beforebegin', '<div id="res"></div><style>.pcard{display:flex;gap:18px;align-items:stretch;padding:16px}.pcard .pimg{flex:0 0 min(42%,340px);aspect-ratio:1;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink3)}.pcard .pimg img{width:100%;height:100%;object-fit:contain}.pcard .pinfo{flex:1;min-width:0;display:flex;flex-direction:column}.pcard .pname{font-family:var(--fh);font-size:clamp(22px,3.2vw,34px);font-weight:700;line-height:1.25}.pcard .pprice{font-family:var(--fh);font-size:clamp(44px,7vw,76px);font-weight:800;color:var(--red);line-height:1.1;margin:8px 0 10px}.pcard .pprice small{font-size:.4em;color:var(--ink2)}.pcard .pmeta{display:grid;gap:6px;font-size:16px}.pcard .pmeta div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}.pcard .pmeta span{color:var(--ink2)}.pcard .pmeta b.low{color:var(--red)}@media (max-width:560px){.pcard{flex-direction:column}.pcard .pimg{flex:none;width:min(70vw,260px);margin:0 auto}.pcard .pinfo{text-align:center}}</style>');
  let mode = 'price'; const hist = [];
  $$('#md button', el).forEach(b => b.onclick = () => { mode = b.dataset.m; $$('#md button', el).forEach(x => x.classList.toggle('on', x === b)); });
  const show = (code, ctx) => {
    const f = findByCode(code);
    if (!f) {
      $('#res', el).innerHTML = `<div class="card"><div class="row"><div class="grow"><b>ไม่พบสินค้า</b><div class="small muted">บาร์โค้ด ${esc(code)}</div></div><button class="btn sm" id="add">${I(IC.plus, 16)} เพิ่มสินค้า</button></div></div>`;
      $('#add', el).onclick = () => editProduct({ barcode: code });
      ctx && ctx.showLast(`<b>ไม่พบ</b> ${esc(code)}`);
      return mode === 'price' ? 'close' : '';
    }
    const p = f.p;
    if (mode === 'stock') {
      p._cnt = (p._cnt || 0) + 1; hist.unshift(p);

      drawHist(); return '';
    }
    if (mode === 'label') { LQ.push({ p, copies: 1 }); ctx && ctx.showLast(`<b>${esc(p.name)}</b> เพิ่มเข้าคิวพิมพ์ (${LQ.length})`); drawHist(); return ''; }
    const im = window.Img && Img.get(p.sku);
    const pr = f.price != null ? f.price : p.price;
    $('#res', el).innerHTML = `<div class="card pcard"><div class="pimg">${im ? `<img src="${im}" alt="">` : `<div class="center">${I(IC.image, 56)}<div class="small">ยังไม่มีรูป</div></div>`}</div>
      <div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="pprice">${num(pr) ? baht(pr) : 'ระบุราคาตอนขาย'}${p.byWeight === 'Y' ? '<small> / กก.</small>' : ''}</div>

    window.scrollTo({ top: 0 });
    const eb = $('#e', el); if (eb) eb.onclick = () => editProduct(p); $('#l', el).onclick = () => go('labels', [p]);
    return 'close';
  };
  const drawHist = () => {
    if (mode === 'stock') {
      const uniq = [...new Set(hist)];
      $('#hist', el).innerHTML = uniq.length ? `<div class="card"><h3>รายการที่นับ (${uniq.length})</h3>${uniq.map(p => `<div class="kv"><span>${esc(p.name)}</span><b>${p._cnt}</b></div>`).join('')}

    } else if (mode === 'label') {
      $('#hist', el).innerHTML = LQ.length ? `<div class="card"><div class="row"><h3 class="grow">คิวพิมพ์ฉลาก (${LQ.length})</h3><button class="btn sm" onclick="go('labels')">ไปพิมพ์</button></div></div>` : '';
    }
  };

  const kb = $('#kb', el); kb.onkeydown = e => { if (e.key === 'Enter' && kb.value.trim()) { beep(); show(kb.value.trim()); kb.value = ''; } };
  kb.onchange = () => { if (kb.value.trim()) { const v = kb.value.trim(); kb.value = ''; if (findByCode(v)) beep(); show(v); } };

  Scanner.on('scan', code => { const a = document.activeElement; if (a && a.blur && a.tagName === 'INPUT') a.blur(); const r = show(code); if (findByCode(code)) beep(); else Scanner.err(); return r; });
  if (!S.products.length) loadProducts(true).catch(e => toast(e.message, 1)); else buildIndex();
};

  const ov = sheet('เลือกสินค้า', `<input class="in" id="pq" placeholder="ค้นหา..."><label class="row small" style="margin:8px 2px"><input type="checkbox" id="pf" checked> เฉพาะของสด / ไม่มีบาร์โค้ด</label><div class="list" id="pl"></div>`, `<button class="btn block" id="ok">เพิ่มที่เลือก (<span id="n">0</span>)</button>`);
  const draw = () => {
    let res = searchProducts(q, {}); if (onlyFresh) res = res.filter(p => !p.barcode || /ของสด/.test(p.category || '') || p.byWeight === 'Y');
    $('#pl', ov).innerHTML = res.slice(0, 80).map(p => `<label class="item"><input type="checkbox" data-s="${esc(p.sku)}" ${sel.has(p.sku) ? 'checked' : ''}>${pthumb(p, 40)}<div class="grow"><div class="t">${esc(p.name)}</div><div class="m">${esc(p.barcode || 'ไม่มีบาร์โค้ด')}</div></div><div class="price" style="font-size:15px">${baht(p.price)}</div></label>`).join('') || '<div class="empty">ไม่พบ</div>';
    $$('[data-s]', ov).forEach(c => c.onchange = () => { c.checked ? sel.set(c.dataset.s, IDX.bySku[c.dataset.s]) : sel.delete(c.dataset.s); $('#n', ov).textContent = sel.size; });
  };
  $('#pq', ov).oninput = e => { q = e.target.value; draw(); }; $('#pf', ov).onchange = e => { onlyFresh = e.target.checked; draw(); };
  $('#ok', ov).onclick = () => { ov.remove(); cb([...sel.values()]); }; draw();
}

/* ---------- RECEIPTS ---------- */
VIEWS.receipts = async el => {
  el.innerHTML = vhead('ใบเสร็จร้านค้าส่ง', `<button class="btn sm" onclick="newReceipt()">${I(IC.cam, 18)} เพิ่ม</button>`) + `
   <div class="row" style="margin-bottom:10px"><select class="in" id="ym" style="max-width:200px"></select><span class="grow"></span><span class="small muted" id="sum"></span></div>
   <div class="list" id="rl"><div class="empty"><span class="spin dark"></span></div></div>`;
  try { S.receipts = await loadTable('Receipts'); } catch (e) { $('#rl', el).innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const months = [...new Set(S.receipts.map(r => String(r.date).slice(0, 7)).concat([todayISO().slice(0, 7)]))].sort().reverse();
  $('#ym', el).innerHTML = `<option value="">ทั้งหมด</option>` + months.map(m => `<option value="${m}">${TH_MF[+m.slice(5) - 1]} ${+m.slice(0, 4) + 543}</option>`).join('');
  $('#ym', el).value = todayISO().slice(0, 7);
  const draw = () => {
    const ym = $('#ym', el).value; const list = S.receipts.filter(r => !ym || String(r.date).startsWith(ym)).sort((a, b) => String(b.date).localeCompare(a.date));
    $('#sum', el).textContent = `${list.length} ใบ · ${baht(list.reduce((s, r) => s + num(r.total), 0))}`;
    $('#rl', el).innerHTML = list.length ? list.map(r => { const n = (JSON.parse(r.items || '[]')).length; return `<div class="item" data-id="${esc(r.id)}"><div class="av" style="background:${r.fileUrl ? 'var(--green-l)' : 'var(--amber-l)'};color:${r.fileUrl ? 'var(--green)' : 'var(--amber)'}">${I(r.fileUrl ? IC.file : IC.alert, 20)}</div><div class="grow"><div class="t">${esc(r.supplier || 'ไม่ระบุร้าน')}</div><div class="m">${thDate(r.date)} · ${esc(r.docNo || '-')} · ${n} รายการ · ${esc(r.type || 'สินค้า')}</div></div><div class="price" style="font-size:16px;color:var(--ink)">${baht(r.total)}</div></div>`; }).join('') : '<div class="empty">ยังไม่มีใบเสร็จในเดือนนี้<br>กด “เพิ่ม” เพื่อถ่ายรูปใบเสร็จ</div>';
    $$('#rl [data-id]', el).forEach(x => x.onclick = () => receiptForm(S.receipts.find(r => r.id === x.dataset.id)));
  };
  $('#ym', el).onchange = draw; draw();
};
function newReceipt() {
  const ov = sheet('เพิ่มใบเสร็จร้านค้าส่ง', `
    <p class="small muted" style="margin-top:0">ถ่ายรูปใบเสร็จให้เห็นรายการชัดเจน วางบนพื้นเรียบ แสงพอ — ระบบจะอ่านรายการสินค้าและให้ตรวจสอบก่อนบันทึก</p>
    <label class="btn block" style="min-height:64px;font-size:17px">${I(IC.cam, 24)} ถ่ายรูป / เลือกรูปใบเสร็จ<input type="file" accept="image/*,application/pdf" capture="environment" id="fi" class="hidden"></label>
    <button class="btn ghost block" style="margin-top:10px" id="man">กรอกเอง (ไม่มีรูป)</button>
    <div class="tiny muted" style="margin-top:10px">${S.apiUrl ? 'อ่านข้อความด้วย Google OCR (หรือ Gemini ถ้าตั้งค่า API key ไว้)' : 'โหมดทดลอง: อ่านข้อความด้วย Tesseract ในเครื่อง (ช้ากว่าและแม่นน้อยกว่า)'}</div>`);
  $('#man', ov).onclick = () => { ov.remove(); receiptForm({ id: uid('R'), date: todayISO(), type: 'สินค้า', items: '[]' }, true); };
  $('#fi', ov).onchange = async e => {
    const f = e.target.files[0]; if (!f) return; ov.remove();
    try {
      busy(1, 'กำลังย่อรูป...'); const img = await compressImage(f);
      busy(1, 'กำลังอัปโหลดรูปเก็บใน Google Drive...');
      const up = await api('upload', { kind: 'receipt', name: `receipt_${todayISO()}_${Date.now()}.jpg`, mime: img.mime, base64: img.dataUrl });
      busy(1, 'กำลังอ่านรายการในใบเสร็จ...');
      let data;
      try {
        const o = await api('ocr', { base64: img.dataUrl, mime: img.mime });
        data = o.data ? { ...o.data, items: (o.data.items || []).map(i => ({ ...i })) } : parseReceiptText(o.text || '');
        data._raw = o.text || ''; data._engine = o.engine;
      } catch (err) { data = { items: [] }; toast('อ่านข้อความไม่สำเร็จ: ' + err.message + ' — กรอกเองได้', 1); }
      if (!S.products.length) await loadProducts(true);
      buildIndex();
      const items = (data.items || []).map(it => {
        const m = matchProduct(it.name, it.code);
        return { name: it.name, code: it.code || '', qty: num(it.qty) || 1, unitCost: num(it.unitPrice) || (num(it.amount) / (num(it.qty) || 1)), amount: num(it.amount), sku: m ? m.p.sku : '', score: m ? m.score : 0, updateCost: !!m, addStock: false, createNew: false };
      });
      busy(0);
      receiptForm({ id: uid('R'), date: data.date || todayISO(), supplier: data.supplier || '', supplierTaxId: data.supplierTaxId || '', docNo: data.docNo || '', type: 'สินค้า', vat: data.vat || '', total: data.total || '', subtotal: data.subtotal || '', fileId: up.fileId, fileUrl: up.fileUrl, items: JSON.stringify(items), _raw: data._raw, _engine: data._engine, _img: img.dataUrl }, true);
    } catch (err) { busy(0); toast(err.message, 1); }
  };
}
function receiptForm(r, isNew) {

    ${r._engine ? `<div class="tiny muted" style="margin-bottom:8px">อ่านด้วย: ${esc(r._engine)} · <b>กรุณาตรวจทุกช่องก่อนยืนยัน</b></div>` : ''}
    <div class="grid2"><label class="f"><span>วันที่ในใบเสร็จ</span><input class="in" type="date" id="r_date" value="${esc(r.date)}"></label>
    <label class="f"><span>ประเภท</span><select class="in" id="r_type"><option>สินค้า</option><option>ค่าใช้จ่าย</option></select></label></div>
    <label class="f"><span>ร้านค้าส่ง / ผู้ขาย</span><input class="in" id="r_supplier" list="supl" value="${esc(r.supplier)}"><datalist id="supl">${[...new Set(S.receipts.map(x => x.supplier).filter(Boolean))].map(s => `<option value="${esc(s)}">`).join('')}</datalist></label>
    <div class="grid2"><label class="f"><span>เลขที่เอกสาร</span><input class="in" id="r_docNo" value="${esc(r.docNo)}"></label><label class="f"><span>เลขผู้เสียภาษีผู้ขาย</span><input class="in" id="r_supplierTaxId" inputmode="numeric" value="${esc(r.supplierTaxId)}"></label></div>
    <div class="card" style="padding:10px"><div class="row" style="margin-bottom:6px"><b class="grow">รายการสินค้า (${items.length})</b><button class="btn ghost sm" id="addi">${I(IC.plus, 16)} เพิ่มแถว</button></div><div id="items"></div></div>
    <div class="grid3"><label class="f"><span>ก่อน VAT</span><input class="in" id="r_subtotal" type="number" step="any" value="${esc(r.subtotal)}"></label><label class="f"><span>VAT</span><input class="in" id="r_vat" type="number" step="any" value="${esc(r.vat)}"></label><label class="f"><span>ยอดรวม *</span><input class="in" id="r_total" type="number" step="any" value="${esc(r.total)}"></label></div>
    <div class="small muted" id="chk"></div>
    <label class="f"><span>ชำระโดย</span><select class="in" id="r_payMethod"><option>เงินสด</option><option>โอน</option><option>เครดิต</option><option>บัตร</option></select></label>
    <label class="f"><span>หมายเหตุ</span><input class="in" id="r_note" value="${esc(r.note)}"></label>
    ${r._raw ? `<details><summary class="small muted">ข้อความที่อ่านได้ (OCR)</summary><pre style="white-space:pre-wrap;font-size:12px;background:#fff;padding:8px;border-radius:8px">${esc(r._raw)}</pre></details>` : ''}
    ${!isNew && isOwner() ? `<button class="btn ghost sm" id="del" style="color:var(--red);margin-top:10px">${I(IC.trash, 16)} ลบใบเสร็จ</button>` : ''}`,
    `<button class="btn grow green" id="sv">${applied ? 'บันทึกการแก้ไข' : 'ยืนยัน นำเข้าระบบ'}</button>`, { sticky: true });
  $('#r_type', ov).value = r.type || 'สินค้า'; $('#r_payMethod', ov).value = r.payMethod || 'เงินสด';
  const drawItems = () => {
    $('#items', ov).innerHTML = items.length ? items.map((it, i) => {
      const p = it.sku ? IDX.bySku[it.sku] : null;
      return `<div style="border-bottom:1px solid var(--line);padding:8px 0">
        <div class="row"><input class="in grow" data-k="name" data-i="${i}" value="${esc(it.name)}" placeholder="ชื่อในใบเสร็จ" style="min-height:38px"><button class="iconbtn" data-del="${i}">${I(IC.x, 18)}</button></div>
        <div class="row tiny" style="margin:6px 0">${p ? `<span class="tag ${it.score >= .75 ? 'green' : 'amber'}">จับคู่: ${esc(p.name)}</span>` : it.createNew ? '<span class="tag blue">จะสร้างสินค้าใหม่</span>' : '<span class="tag red">ยังไม่จับคู่สินค้า</span>'}<button class="btn ghost sm" data-match="${i}" style="min-height:28px;padding:2px 8px">${p ? 'เปลี่ยน' : 'เลือกสินค้า'}</button></div>
        <div class="grid3"><label class="tiny muted">จำนวน<input class="in" type="number" step="any" data-k="qty" data-i="${i}" value="${it.qty}"></label><label class="tiny muted">ทุน/หน่วย<input class="in" type="number" step="any" data-k="unitCost" data-i="${i}" value="${it.unitCost}"></label><label class="tiny muted">รวม<input class="in" type="number" step="any" data-k="amount" data-i="${i}" value="${it.amount}"></label></div>
        ${p || it.createNew ? `<div class="row tiny" style="margin-top:6px;gap:12px"><label class="row"><input type="checkbox" data-c="updateCost" data-i="${i}" ${it.updateCost ? 'checked' : ''}> อัปเดตต้นทุน${p && num(p.cost) ? ` (เดิม ${money(p.cost)})` : ''}</label><label class="row"><input type="checkbox" data-c="addStock" data-i="${i}" ${it.addStock ? 'checked' : ''}> เพิ่มสต็อก</label></div>` : ''}
      </div>`;
    }).join('') : '<div class="empty small">ไม่มีรายการ</div>';
    $$('[data-k]', ov).forEach(inp => inp.onchange = () => { const it = items[+inp.dataset.i], k = inp.dataset.k; it[k] = k === 'name' ? inp.value : num(inp.value); if (k === 'qty' || k === 'unitCost') it.amount = Math.round(num(it.qty) * num(it.unitCost) * 100) / 100; if (k === 'amount') it.unitCost = Math.round(num(it.amount) / (num(it.qty) || 1) * 100) / 100; drawItems(); });
    $$('[data-c]', ov).forEach(c => c.onchange = () => items[+c.dataset.i][c.dataset.c] = c.checked);
    $$('[data-del]', ov).forEach(b => b.onclick = () => { items.splice(+b.dataset.del, 1); drawItems(); });
    $$('[data-match]', ov).forEach(b => b.onclick = () => matchDlg(items[+b.dataset.match], drawItems));
    const sum = items.reduce((s, it) => s + num(it.amount), 0); const tot = num($('#r_total', ov).value);
    $('#chk', ov).innerHTML = items.length ? `รวมรายการ ${money(sum)} ${tot ? (Math.abs(sum - tot) < 1 ? '<span class="tag green">ตรงกับยอดรวม</span>' : Math.abs(sum + num($('#r_vat', ov).value) - tot) < 1 ? '<span class="tag green">ตรง (รวม VAT)</span>' : `<span class="tag amber">ต่างจากยอดรวม ${money(tot - sum)}</span>`) : ''}` : '';
  };
  $('#addi', ov).onclick = () => { items.push({ name: '', qty: 1, unitCost: 0, amount: 0, sku: '', updateCost: true, addStock: false }); drawItems(); };
  $('#r_total', ov).onchange = drawItems;
  drawItems();
  $('#sv', ov).onclick = async () => {
    const rc = { id: r.id, fileId: r.fileId || '', fileUrl: /^data:/.test(r.fileUrl || '') && r.fileUrl.length > 400000 ? '' : (r.fileUrl || ''), createdAt: r.createdAt, createdBy: r.createdBy };
    ['date', 'type', 'supplier', 'docNo', 'supplierTaxId', 'subtotal', 'vat', 'total', 'payMethod', 'note'].forEach(k => rc[k] = $('#r_' + k, ov).value.trim());
    if (!rc.total) rc.total = String(items.reduce((s, it) => s + num(it.amount), 0));
    if (!rc.date) return toast('กรุณาใส่วันที่', 1);
    rc.items = JSON.stringify(items.map(({ score, ...it }) => it));
    try {
      busy(1, 'กำลังบันทึก...');
      if (applied) { rc.stockApplied = 'Y'; await api('upsert', { table: 'Receipts', rows: [rc] }); }
      else { const res = await api('applyReceipt', { receipt: rc }); toast(`บันทึกแล้ว · อัปเดตสินค้า ${res.updated} รายการ${res.created ? ` · สร้างใหม่ ${res.created}` : ''}`); await loadProducts(true); }
      busy(0); ov.remove(); if (S.view === 'receipts') go('receipts');
    } catch (e) { busy(0); toast(e.message, 1); }
  };
  const d = $('#del', ov); if (d) d.onclick = async () => { if (!(await confirmDlg('ลบใบเสร็จนี้? (สต็อก/ต้นทุนที่อัปเดตไปแล้วจะไม่ย้อนกลับ)', 'ลบ', true))) return; try { busy(1); await api('remove', { table: 'Receipts', ids: [r.id] }); busy(0); ov.remove(); go('receipts'); } catch (e) { busy(0); toast(e.message, 1); } };
}
function matchDlg(it, done) {
  let q = it.name || '';
  const ov = sheet('จับคู่สินค้า', `<div class="small muted" style="margin-bottom:6px">ในใบเสร็จ: <b>${esc(it.name)}</b></div><input class="in" id="mq" value="${esc(q)}"><div class="list" id="ml" style="margin-top:8px"></div>`, `<button class="btn ghost grow" id="nw">สร้างเป็นสินค้าใหม่</button><button class="btn ghost grow" id="sk">ไม่จับคู่</button>`);
  const draw = () => {
    let res = searchProducts(q); if (!res.length) res = S.products.map(p => [p, sim(q, p.name)]).sort((a, b) => b[1] - a[1]).slice(0, 20).map(x => x[0]);
    $('#ml', ov).innerHTML = res.slice(0, 40).map(p => `<div class="item" data-s="${esc(p.sku)}">${pthumb(p, 40)}<div class="grow"><div class="t">${esc(p.name)}</div><div class="m">${esc(p.barcode || '')} · ทุน ${money(p.cost)}</div></div><div class="price" style="font-size:15px">${baht(p.price)}</div></div>`).join('');
    $$('[data-s]', ov).forEach(x => x.onclick = () => { it.sku = x.dataset.s; it.score = 1; it.createNew = false; it.updateCost = true; ov.remove(); done(); });
  };
  $('#mq', ov).oninput = e => { q = e.target.value; draw(); };
  $('#nw', ov).onclick = () => { it.sku = ''; it.createNew = true; it.updateCost = true; ov.remove(); done(); };
  $('#sk', ov).onclick = () => { it.sku = ''; it.createNew = false; ov.remove(); done(); };
  draw();
}

   รูปที่เลือกย่อเหลือ ~10–30 KB เก็บในเครื่อง (ใช้ได้ออฟไลน์) และบันทึกขึ้นฐานข้อมูลเหมือนรูปที่ถ่ายเอง */
async function urlToBlob(url) {
  if (/^data:image\//.test(url)) return (await fetch(url)).blob();
  try { const r = await fetch(url, { mode: 'cors' }); if (r.ok) { const b = await r.blob(); if (/^image\//.test(b.type)) return b; } } catch (e) { }
  if (!S.apiUrl) throw new Error('โหลดรูปจากลิงก์นี้ไม่ได้ (ต้องเชื่อมต่อ Google ก่อน)');
  const r = await api('fetchImage', { url }); return (await fetch('data:' + r.mime + ';base64,' + r.base64)).blob();
}

/* ---------- แนะนำชื่อสินค้าจากบาร์โค้ด ----------
   อัตโนมัติ: ฐานข้อมูลสินค้าเปิด (Open Food / Beauty / Products / Pet Food Facts — ค้นพร้อมกัน รอไม่เกิน 4 วิ)
              + สินค้ายี่ห้อเดียวกันในร้าน (บาร์โค้ด 9 หลักแรกตรงกัน) ไว้ใช้เป็นแบบตั้งชื่อ
   ห้างใหญ่ไม่เปิดให้ระบบอื่นดึงข้อมูล → ใช้ "วางชื่อที่คัดลอกมา" จากที่ไหนก็ได้
   ทำงานเฉพาะในหน้าเพิ่ม/แก้สินค้า ไม่แตะหน้าขาย · ผลค้นเก็บในเครื่อง (ค้นซ้ำทันที) */
const NS_DB = [['https://world.openfoodfacts.org', 'อาหาร/เครื่องดื่ม'], ['https://world.openbeautyfacts.org', 'ความงาม'], ['https://world.openproductsfacts.org', 'ของใช้'], ['https://world.openpetfoodfacts.org', 'อาหารสัตว์']];
const nsClean = t => String(t || '').replace(/\s+/g, ' ').replace(/\s*[|–—-]\s*(makro|big ?c|lotus'?s|tops|dohome|ไทวัสดุ|thai ?watsadu|global ?house|โกลบอล.*|แม็คโคร|บิ๊กซี|โลตัส|ท็อปส์|ดูโฮม).*$/i, '').replace(/^ราคา\s*/, '').trim().slice(0, 120);
function nsNames(res) {
  const out = [], seen = new Set();
  const add = (t, src) => { t = nsClean(t); const k = t.toLowerCase().replace(/\s/g, ''); if (t.length >= 2 && !seen.has(k)) { seen.add(k); out.push({ t, src }); } };
  res.forEach(x => {
    const br = String(x.brands || '').split(',')[0].trim(), q = String(x.quantity || '').replace(/\s+/g, ''), src = 'ฐานข้อมูลสินค้า · ' + x._db;
    const withQ = n => n && q && !n.replace(/\s/g, '').toLowerCase().includes(q.toLowerCase()) ? n + ' ' + q : n;
    const withB = n => n && br && !n.toLowerCase().includes(br.toLowerCase()) ? br + ' ' + n : n;
    [x.product_name_th, x.generic_name_th].filter(Boolean).forEach(n => { add(withQ(n), src); add(withQ(withB(n)), src); });
    [x.product_name, x.product_name_en, x.generic_name].filter(Boolean).forEach(n => { add(withQ(withB(n)), src); add(n, src); });
  });
  return out.slice(0, 5);
}
// ค้นพร้อมกันทุกฐานข้อมูล · ได้ผลจากที่ไหนก่อนแสดงก่อน (onPart) · แต่ละที่รอไม่เกิน 4 วิ
async function nsLookup(code, onPart) {
  const C = LS.get('nsCache', {}), hit = C[code];
  if (hit && Date.now() - hit.t < (hit.l.length ? 60 : 3) * 864e5) return hit.l;
  const F = 'product_name,product_name_th,product_name_en,generic_name,generic_name_th,brands,quantity', got = [];
  const one = ([base, db]) => { const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 4000);
    return fetch(`${base}/api/v2/product/${code}.json?fields=${F}`, { signal: ac.signal }).then(r => r.ok ? r.json() : null)
      .then(j => { if (j && j.product) { got.push({ ...j.product, _db: db }); onPart && onPart(nsNames(got)); } }).catch(() => { }).finally(() => clearTimeout(tm)); };
  await Promise.all(NS_DB.map(one));
  const l = nsNames(got); C[code] = { t: Date.now(), l };
  const ks = Object.keys(C); if (ks.length > 500) ks.sort((a, b) => C[a].t - C[b].t).slice(0, ks.length - 500).forEach(k => delete C[k]);
  LS.set('nsCache', C); return l;
}
function nsSimilar(code, self) {
  if (!/^\d{13}$/.test(code) || /^2[0-9]/.test(code)) return [];
  const pre = code.slice(0, 9);
  return (S.products || []).filter(x => x.sku !== self && String(x.barcode || '').length === 13 && String(x.barcode).startsWith(pre) && String(x.barcode) !== code).slice(0, 3).map(x => ({ t: x.name, src: 'ยี่ห้อเดียวกันในร้าน', tpl: 1 }));
}
function nameSuggest(root, o) {

  const st = {};
  const pick = t => { prev = prev == null ? inp.value : prev; inp.value = t; inp.dispatchEvent(new Event('input', { bubbles: true })); draw.last && draw(draw.last, true); toast('ใส่ชื่อแล้ว — แก้ต่อได้ในช่องชื่อ'); };
  const draw = (r, picked) => {

    const ta = $('#ta', el); if (ta) ta.onclick = async () => { try { busy(1); const r = await api('testAlert'); busy(0); toast(r.sent ? `ส่งอีเมลแล้ว (${r.sent} รายการ)` : 'ไม่มีรายการที่ต้องแจ้งเตือนใน 90 วัน'); } catch (e) { busy(0); toast(e.message, 1); } };
    $('#cn', el).onclick = connectDlg;
    const al = cfg('autoLogout', { on: false, hours: 8 }), alSync = () => { $('#alhw', el).style.opacity = $('#alon', el).checked ? 1 : .45; };
    $('#alon', el).checked = !!al.on; $('#alh', el).value = String(al.hours); if (!$('#alh', el).value) $('#alh', el).value = '8'; alSync();
    $('#alon', el).onchange = alSync;
    $('#alsv', el).onclick = async () => { try { busy(1); await saveSetting('autoLogout', { on: $('#alon', el).checked, hours: +$('#alh', el).value }); busy(0); IdleLock.last = Date.now(); toast($('#alon', el).checked ? 'เปิดออกจากระบบอัตโนมัติ: ' + $('#alh', el).selectedOptions[0].textContent : 'ปิดออกจากระบบอัตโนมัติแล้ว'); } catch (e) { busy(0); toast(e.message, 1); } };
  }
  $('#cc', el).onclick = () => { LS.del('products'); LS.del('productsAt'); S.products = []; toast('ล้างแคชแล้ว'); };
};

/* ---------- BOOT ---------- */
/* ตรวจว่าไฟล์ระบบโหลดครบ ถ้าไม่ครบ (เช่นเบราว์เซอร์ยังจำไฟล์เก่า) ล้างแคชแล้วโหลดใหม่ 1 ครั้ง ถ้ายังไม่ครบ แจ้งชื่อไฟล์ที่ขาด */
function missingFiles() {
  const chk = { 'logic.js': () => typeof Logic !== 'undefined', 'cache.js': () => typeof Cache !== 'undefined', 'offline.js': () => typeof OfflineAuth !== 'undefined', 'scanner.js': () => typeof Scanner !== 'undefined', 'printer.js': () => typeof RP !== 'undefined', 'pos.js': () => typeof POS !== 'undefined', 'display.js': () => !!VIEWS.displayset, 'idle.js': () => typeof idleScene !== 'undefined', 'reports.js': () => !!VIEWS.reports, 'inventory.js': () => !!VIEWS.stockcount, 'people.js': () => !!VIEWS.staff, 'quality.js': () => !!VIEWS.dataquality, 'services.js': () => typeof svcMenu !== 'undefined', 'owner.js': () => !!VIEWS.home };
  return Object.keys(chk).filter(f => { try { return !chk[f](); } catch (e) { return true; } });
}
async function selfHeal(miss) {
  if (!sessionStorage.getItem('mm_heal')) {
    sessionStorage.setItem('mm_heal', '1');
    try { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); } catch (e) { }
    try { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (e) { }
    location.reload(); return;
  }
  app.innerHTML = `<div class="login"><div class="card" style="max-width:520px"><h3>ไฟล์ระบบโหลดไม่ครบ</h3><p>ไฟล์ที่ขาด: <b>${miss.join(', ')}</b></p><p class="small muted">ตรวจว่าไฟล์เหล่านี้อยู่หน้าแรกของ repo Maymini บน GitHub (ไม่อยู่ในโฟลเดอร์ย่อย) แล้วรอ 2–3 นาทีให้ GitHub อัปเดต</p><button class="btn block" onclick="sessionStorage.removeItem('mm_heal');location.reload()">ลองใหม่</button></div></div>`;
}
async function boot() {
  const miss = missingFiles(); if (miss.length) return selfHeal(miss);
  sessionStorage.removeItem('mm_heal');
  if (!S.apiUrl && !document.getElementById('demobar') && location.hash.indexOf('#display') !== 0 && !/[?&]display=1/.test(location.search)) document.body.insertAdjacentHTML('afterbegin', '<div id="demobar" style="position:fixed;left:0;right:0;bottom:0;z-index:70;background:#B45309;color:#fff;text-align:center;font-size:13px;padding:4px 8px;pointer-events:none">โหมดทดลอง — เครื่องนี้ยังไม่ได้เชื่อมฐานข้อมูลร้าน (ข้อมูลไม่ใช่ของจริง)</div>');
  // เปิดจากไอคอนแอป "จอลูกค้า" (?display=1) → เข้าหน้าจอลูกค้าของเครื่องนี้ทันที
  if (/[?&]display=1/.test(location.search) && location.hash.indexOf('#display') !== 0) { let c = ''; try { c = localStorage.getItem('mm_dispOwnCode') || ''; } catch (e) { } history.replaceState(null, '', location.pathname + location.search + '#display' + (c ? '-' + c : '')); }
  const h0 = (location.hash || '').slice(1);
  if (/^display/.test(h0) && VIEWS.display) return VIEWS.display(app, h0);
  if (!S.user || !S.token) return renderLogin();
  document.onkeydown = null;
  shell(); buildIndex();
  const first = loadSettings();
  if (!S.settings.shopName || !Object.keys(S.perms || {}).length) await first;
  window.Sync && Sync.start();
  const v = isKiosk() ? 'pos' : (h0 || 'home');
  go(VIEWS[v] ? v : 'home');
  IdleLock.start(); window.warmCache && warmCache();
  document.dispatchEvent(new Event('mm:booted'));
}
/* ล็อกหน้าจอเมื่อไม่ได้ใช้งาน (กันคนอื่นใช้สิทธิ์เจ้าของบนเครื่องที่วางไว้หน้าร้าน) */
const IdleLock = {
  last: Date.now(),
  start() {
    if (this.on) return; this.on = true;
    ['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, () => this.last = Date.now(), { passive: true }));
    setInterval(() => {
      if (!S.user) return;
      if (S.longJob) { this.last = Date.now(); return; }   // กำลังนำเข้าข้อมูลใหญ่ — ไม่ล็อก/ไม่ออกจากระบบ
      // ค่าเริ่มต้น = ไม่ออกจากระบบอัตโนมัติ · เจ้าของเปิด/ตั้งชั่วโมงได้ที่ ตั้งค่า › ร้าน · การเชื่อมต่อ
      const al = cfg('autoLogout', { on: false, hours: 8 }), mins = al.on ? Math.round(num(al.hours) * 60) : 0;
      // มือถือเจ้าของที่ตั้ง "ไม่ต้องออกจากระบบอัตโนมัติ" ไว้ → ไม่ล็อก (รับแจ้งเตือนงานได้ตลอด)
      const applies = S.user.role === 'owner' ? !LS.get('stayIn', false) : !isKiosk();
      if (mins > 0 && applies && Date.now() - this.last > mins * 60e3) { Elev.clear(); toast('ออกจากระบบอัตโนมัติ (ไม่ได้ใช้งาน ' + (mins >= 60 ? (mins / 60) + ' ชั่วโมง' : mins + ' นาที') + ')'); logout(); }
    }, 20e3);
  }
};
window.addEventListener('online', () => { S.online = true; const n = $('.net'); n && n.classList.remove('off'); });
window.addEventListener('offline', () => { S.online = false; const n = $('.net'); n && n.classList.add('off'); });
/* แจ้งเตือนบนมือถือ (Web Push) — เฉพาะเจ้าของร้าน */
const PushMe = {
  ok: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
  ios: () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  standalone: () => matchMedia('(display-mode: standalone)').matches || !!navigator.standalone,
  devName: () => { const u = navigator.userAgent; return (/iPad/.test(u) || (PushMe.ios() && !/iPhone/.test(u)) ? 'iPad' : /iPhone/.test(u) ? 'iPhone' : /Android/.test(u) ? (/Mobile/.test(u) ? 'มือถือ Android' : 'แท็บเล็ต Android') : 'คอมพิวเตอร์') + ' · ' + new Date().toLocaleDateString('th-TH'); },
  put(k, v) { return new Promise((res, rej) => { const q = indexedDB.open('mm-push', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => { const t = q.result.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }; q.onerror = () => rej(q.error); }); },
  reg() { return Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('ยังไม่พร้อม — เปิดแอปจากลิงก์ https ของร้าน')), 5000))]); },
  b64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); const b = atob(s + '==='.slice((s.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); },
  async state() {
    if (!this.ok()) return this.ios() && !this.standalone() ? 'ios-home' : 'unsupported';
    if (Notification.permission === 'denied') return 'denied';
    const reg = await this.reg().catch(() => null); if (!reg) return 'unsupported'; const s = await reg.pushManager.getSubscription();
    return s && LS.get('pushId', '') ? 'on' : 'off';
  },
  async enable() {
    if (!S.apiUrl) throw new Error('ต้องเชื่อมต่อ Google ก่อน (โหมดทดลองใช้ไม่ได้)');
    if ((await Notification.requestPermission()) !== 'granted') throw new Error('ไม่ได้รับอนุญาตให้แจ้งเตือน — กด "อนุญาต" เมื่อเบราว์เซอร์ถาม');
    const { key } = await api('pushKey', {}), reg = await this.reg();
    let sub = await reg.pushManager.getSubscription();
    if (sub) { const cur = sub.options && sub.options.applicationServerKey; if (cur && btoa(String.fromCharCode(...new Uint8Array(cur))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') !== key) { await sub.unsubscribe(); sub = null; } }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: this.b64(key) });
    const r = await api('pushSubscribe', { sub: { ...sub.toJSON(), origin: location.origin }, name: this.devName() });
    await this.put('cfg', { api: S.apiUrl, secret: r.secret }); LS.set('pushId', r.id);
  },
  async disable() {
    try { const reg = await this.reg(), s = await reg.pushManager.getSubscription(); if (s) await s.unsubscribe(); } catch (e) { }
    const id = LS.get('pushId', ''); LS.del('pushId'); await this.put('cfg', null).catch(() => { });
    if (id) await api('pushRemove', { id }).catch(() => { });
  }
};
window.PushMe = PushMe;
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.go && S.user && VIEWS[e.data.go]) go(e.data.go); });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (S.user && VIEWS[v] && v !== S.view) go(v); });
loadScript('https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js', 'JsBarcode').catch(() => { });
</script>
